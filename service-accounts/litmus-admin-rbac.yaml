apiVersion: v1
kind: ServiceAccount
metadata:
  name: litmus-admin
  namespace: litmus
  labels:
    name: litmus-admin
---
# Source: openebs/templates/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litmus-admin
  labels:
    name: litmus-admin
rules:
# Core chaos experiment resources
- apiGroups: ["","apps","batch","extensions","litmuschaos.io"]
  resources: ["pods","pods/exec","pods/eviction","jobs","cronjobs","events","chaosresults","chaosengines"]
  verbs: ["create","delete","get","list","patch","update","deletecollection","watch"]
- apiGroups: ["litmuschaos.io"]
  resources: ["chaosexperiments"]
  verbs: ["create","list","get","patch","update","delete"]
- apiGroups: [""]
  resources: ["pods/log","pods/status"]
  verbs: ["get","list","watch"]
- apiGroups: [""]
  resources: ["pods/ephemeralcontainers"]
  verbs: ["get","patch","update"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create","get","list","patch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get","list","patch","update"]
# For install/uninstall application and agent faults
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["create","get","list","delete","patch","update"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create","get","list","delete","patch","update"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["create","get","list","patch","update"]
- apiGroups: [""]
  resources: ["serviceaccounts","secrets"]
  verbs: ["create","get","list","delete","patch"]
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["create","delete","get","list","patch","update"]
- apiGroups: ["apps"]
  resources: ["deployments","statefulsets","replicasets","daemonsets"]
  verbs: ["create","get","list","delete","patch","update","watch"]
# Subresources: the base-resource rule above does not implicitly cover these --
# Kubernetes RBAC treats "deployments/scale" etc. as distinct resource names.
- apiGroups: ["apps"]
  resources: ["deployments/scale","deployments/rollback","statefulsets/scale"]
  verbs: ["get","list","patch","update"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get","list","patch","update"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create","delete","get","list"]
- apiGroups: ["scheduling.k8s.io"]
  resources: ["priorityclasses"]
  verbs: ["create","delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
  verbs: ["create","get","list","delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["create","get","list","delete","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litmus-admin
  labels:
    name: litmus-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litmus-admin
subjects:
- kind: ServiceAccount
  name: litmus-admin
  namespace: litmus
