---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: bookinfo-itbench
  version: 0.1.0
  annotations:
    categories: bookinfo
    chartDescription: >-
      Runs two ITBench SRE scenarios sequentially against the Bookinfo
      application: invalid service selector on the details service, and a
      nonexistent PVC reference on the reviews-v3 deployment.
spec:
  displayName: Bookinfo — ITBench SRE Scenarios
  categoryDescription: >
    Sequential evaluation workflow targeting the Bookinfo (book-info) application.
    Each step injects one ITBench SRE fault and holds it for a configurable
    window (default 300 s) while the flash-agent observes, diagnoses, and
    remediates. The fault is reverted automatically after the window expires.

    Scenarios covered:
      #36  invalid-kubernetes-service-selector              (details)
      #53  nonexistent-kubernetes-workload-persistent-volume-claim (reviews-v3)

    ITBench reference: https://github.com/itbench-hub/ITBench
    Applications required: bookinfo (app-charts/charts/bookinfo)

    Note: Bookinfo mesh-dependent scenarios (mTLS enforcement, Istio
    authorization-policy, ambient-mode faults) require Istio installed as a
    cluster prerequisite and are not covered here.
  faults:
    - name: bookinfo-itbench
      description: >-
        Two sequential ITBench SRE fault scenarios against the Bookinfo
        application.
  keywords:
    - Kubernetes
    - ITBench
    - SRE
    - bookinfo
    - misconfiguration
  platforms:
    - GKE
    - AKS
    - EKS
    - Kind
    - Minikube
  icon:
    - url: ""
      mediatype: ""
