apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  # generateName allows multiple independent runs from the same definition.
  # LitmusChaos UI stores this via "Upload Experiment" and triggers via "Run".
  generateName: argowf-itbench-2s5r-
  namespace: litmus
  labels:
    subject: "itbench-2scenario-5run-benchmark"
spec:
  entrypoint: argowf-chaos
  serviceAccountName: argo-chaos
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true

  arguments:
    parameters:
      - name: adminModeNamespace
        value: "litmus"
      - name: appNamespace
        value: "otel-demo"

      # ── Agent selection ──────────────────────────────────────────────────
      # Change agentFolder to select a different agent:
      #   sre-agent-comprehensive  (default — live K8s + MCP remediation)
      #   sre-agent                (offline ITBench snapshot mode)
      #   sre-agent-crewai         (CrewAI multi-agent SRE)
      #   ciso-agent               (CISO compliance agent)
      #   flash-agent              (FLASH-methodology ITOps)
      - name: agentFolder
        value: "sre-agent-comprehensive"

      - name: installTimeout
        value: "30m"

      # ── LLM / sidecar configuration ─────────────────────────────────────
      - name: openaiApiKey
        value: ""
      - name: openaiModel
        value: "gpt-4o"
      - name: openaiBaseUrl
        value: "http://litellm.ace.svc.cluster.local:14000/v1"
      - name: litellmUpstream
        value: "http://litellm.ace.svc.cluster.local:14000"
      - name: scanInterval
        value: "60"

      # ── Fault parameters ────────────────────────────────────────────────
      # How many seconds the fault is held before auto-revert.
      # Give the agent enough time to detect + remediate.
      - name: faultDuration
        value: "300"

      # Pause between consecutive runs of the same scenario (seconds).
      # Allows the cluster to stabilise before the next fault injection.
      - name: interRunPause
        value: "60"

  templates:

    # ── Entrypoint ─────────────────────────────────────────────────────────
    - name: argowf-chaos
      steps:

        # ── Setup ──────────────────────────────────────────────────────────
        - - name: install-application
            template: install-application
        - - name: install-agent
            template: install-agent
        - - name: install-chaos-experiments
            template: install-chaos-experiments

        # ── Scenario #58 × 5 sequential runs ───────────────────────────────
        # ITBench: scaled-to-zero-kubernetes-workload
        # Symptom: HighRequestErrorRate + NoRequestsReceived on accounting.
        # Agent must detect that the accounting Deployment has 0 replicas
        # and scale it back up.

        - - name: s58-run-1
            template: scenario-58-run
            arguments:
              parameters:
                - name: runIndex
                  value: "1"
        - - name: s58-wait-1
            template: inter-run-wait
        - - name: s58-run-2
            template: scenario-58-run
            arguments:
              parameters:
                - name: runIndex
                  value: "2"
        - - name: s58-wait-2
            template: inter-run-wait
        - - name: s58-run-3
            template: scenario-58-run
            arguments:
              parameters:
                - name: runIndex
                  value: "3"
        - - name: s58-wait-3
            template: inter-run-wait
        - - name: s58-run-4
            template: scenario-58-run
            arguments:
              parameters:
                - name: runIndex
                  value: "4"
        - - name: s58-wait-4
            template: inter-run-wait
        - - name: s58-run-5
            template: scenario-58-run
            arguments:
              parameters:
                - name: runIndex
                  value: "5"

        # ── Inter-scenario pause ────────────────────────────────────────────
        - - name: inter-scenario-wait
            template: inter-run-wait

        # ── Scenario #20 × 5 sequential runs ───────────────────────────────
        # ITBench: nonexistent-kubernetes-workload-container-image
        # Symptom: KubePodNotReady on product-catalog (ImagePullBackOff).
        # Agent must detect the invalid image tag and run kubectl rollout undo.

        - - name: s20-run-1
            template: scenario-20-run
            arguments:
              parameters:
                - name: runIndex
                  value: "1"
        - - name: s20-wait-1
            template: inter-run-wait
        - - name: s20-run-2
            template: scenario-20-run
            arguments:
              parameters:
                - name: runIndex
                  value: "2"
        - - name: s20-wait-2
            template: inter-run-wait
        - - name: s20-run-3
            template: scenario-20-run
            arguments:
              parameters:
                - name: runIndex
                  value: "3"
        - - name: s20-wait-3
            template: inter-run-wait
        - - name: s20-run-4
            template: scenario-20-run
            arguments:
              parameters:
                - name: runIndex
                  value: "4"
        - - name: s20-wait-4
            template: inter-run-wait
        - - name: s20-run-5
            template: scenario-20-run
            arguments:
              parameters:
                - name: runIndex
                  value: "5"

        # ── Optional cleanup ────────────────────────────────────────────────
        # Uncomment to uninstall the agent after the last run:
        #- - name: delete-agent
        #    template: delete-agent

    # ── Setup templates ─────────────────────────────────────────────────────

    - name: install-application
      container:
        image: agentcert/agentcert-install-app:latest
        imagePullPolicy: IfNotPresent
        args:
          - "-folder=otel-demo"
          - "-namespace=otel-demo"
          - "-create-namespace"
          - "-wait"
          - "-timeout={{workflow.parameters.installTimeout}}"

    - name: install-agent
      container:
        image: agentcert/agentcert-install-agent:latest
        imagePullPolicy: Always
        args:
          - "-folder={{workflow.parameters.agentFolder}}"
          - "-namespace={{workflow.parameters.appNamespace}}"
          - "-create-namespace"
          - "-timeout={{workflow.parameters.installTimeout}}"
          - "--set=agent.secret.OPENAI_API_KEY={{workflow.parameters.openaiApiKey}}"
          - "--set=agent.config.MODEL_ALIAS={{workflow.parameters.openaiModel}}"
          - "--set=agent.config.OPENAI_BASE_URL={{workflow.parameters.openaiBaseUrl}}"
          - "--set=agent.config.SCAN_INTERVAL={{workflow.parameters.scanInterval}}"
          - "--set=agent.notifyId={{workflow.name}}"
          - "--set=agent.workflowUid={{workflow.uid}}"
          - "--set=sidecar.upstream={{workflow.parameters.litellmUpstream}}"

    # ── Install ChaosExperiment CRs ─────────────────────────────────────────
    # Both ITBench experiment definitions are applied into the admin namespace
    # before any ChaosEngine is created; the chaos-operator needs them present.

    - name: install-chaos-experiments
      inputs:
        artifacts:
          - name: scaled-to-zero-kubernetes-workload
            path: /tmp/scaled-to-zero-kubernetes-workload.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                description:
                  message: |
                    Scales the target Deployment to 0 replicas then restores it.
                    Mirrors ITBench SRE scenario "scaled-to-zero-kubernetes-workload".
                kind: ChaosExperiment
                metadata:
                  name: scaled-to-zero-kubernetes-workload
                  labels:
                    name: scaled-to-zero-kubernetes-workload
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: chaosexperiment
                    app.kubernetes.io/version: ci
                spec:
                  definition:
                    scope: Namespaced
                    permissions:
                      - apiGroups: [""]
                        resources: ["pods", "events"]
                        verbs: ["create", "get", "list", "patch", "update"]
                      - apiGroups: ["apps"]
                        resources: ["deployments", "statefulsets", "deployments/scale", "statefulsets/scale"]
                        verbs: ["get", "list", "patch", "update"]
                      - apiGroups: ["litmuschaos.io"]
                        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
                        verbs: ["create", "list", "get", "patch", "update", "delete"]
                    image: "litmuschaos/k8s:latest"
                    imagePullPolicy: Always
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - |
                        set -eu
                        echo "Resolving target ${APP_KIND} in ns=${APP_NAMESPACE} label=${APP_LABEL}"
                        TARGET=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" -l "${APP_LABEL}" -o jsonpath='{.items[0].metadata.name}')
                        if [ -z "$TARGET" ]; then
                          echo "no ${APP_KIND} found matching label ${APP_LABEL} in ${APP_NAMESPACE}" >&2
                          exit 1
                        fi
                        ORIG_REPLICAS=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" -o jsonpath='{.spec.replicas}')
                        ORIG_REPLICAS=${ORIG_REPLICAS:-1}
                        echo "Target=${TARGET} originalReplicas=${ORIG_REPLICAS}"
                        echo "Injecting: scaling ${TARGET} to 0 replicas"
                        kubectl scale -n "${APP_NAMESPACE}" "${APP_KIND}/${TARGET}" --replicas=0
                        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
                        sleep "${TOTAL_CHAOS_DURATION}"
                        echo "Reverting: scaling ${TARGET} back to ${ORIG_REPLICAS} replicas"
                        kubectl scale -n "${APP_NAMESPACE}" "${APP_KIND}/${TARGET}" --replicas="${ORIG_REPLICAS}"
                    env:
                      - name: APP_NAMESPACE
                        value: ""
                      - name: APP_LABEL
                        value: ""
                      - name: APP_KIND
                        value: "deployment"
                      - name: TOTAL_CHAOS_DURATION
                        value: "300"
                    labels:
                      name: scaled-to-zero-kubernetes-workload
                      app.kubernetes.io/part-of: litmus
                      app.kubernetes.io/component: experiment-job
                      app.kubernetes.io/version: ci
          - name: nonexistent-kubernetes-workload-container-image
            path: /tmp/nonexistent-kubernetes-workload-container-image.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                description:
                  message: |
                    Sets a container image to a nonexistent tag causing ImagePullBackOff,
                    then restores the original image.
                    Mirrors ITBench SRE scenario "nonexistent-kubernetes-workload-container-image".
                kind: ChaosExperiment
                metadata:
                  name: nonexistent-kubernetes-workload-container-image
                  labels:
                    name: nonexistent-kubernetes-workload-container-image
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: chaosexperiment
                    app.kubernetes.io/version: ci
                spec:
                  definition:
                    scope: Namespaced
                    permissions:
                      - apiGroups: [""]
                        resources: ["pods", "events"]
                        verbs: ["create", "get", "list", "patch", "update"]
                      - apiGroups: ["apps"]
                        resources: ["deployments", "statefulsets"]
                        verbs: ["get", "list", "patch", "update"]
                      - apiGroups: ["litmuschaos.io"]
                        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
                        verbs: ["create", "list", "get", "patch", "update", "delete"]
                    image: "litmuschaos/k8s:latest"
                    imagePullPolicy: Always
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - |
                        set -eu
                        echo "Resolving target ${APP_KIND} in ns=${APP_NAMESPACE} label=${APP_LABEL}"
                        TARGET=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" -l "${APP_LABEL}" -o jsonpath='{.items[0].metadata.name}')
                        if [ -z "$TARGET" ]; then
                          echo "no ${APP_KIND} found matching label ${APP_LABEL} in ${APP_NAMESPACE}" >&2
                          exit 1
                        fi
                        CONTAINER="${TARGET_CONTAINER:-$TARGET}"
                        ORIG_IMAGE=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" -o jsonpath="{.spec.template.spec.containers[?(@.name=='${CONTAINER}')].image}")
                        if [ -z "$ORIG_IMAGE" ]; then
                          echo "container ${CONTAINER} not found on ${TARGET}" >&2
                          exit 1
                        fi
                        echo "Target=${TARGET} container=${CONTAINER} originalImage=${ORIG_IMAGE}"
                        echo "Injecting: setting image to ${INVALID_IMAGE}"
                        kubectl set image -n "${APP_NAMESPACE}" "${APP_KIND}/${TARGET}" "${CONTAINER}=${INVALID_IMAGE}"
                        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
                        sleep "${TOTAL_CHAOS_DURATION}"
                        echo "Reverting: restoring image to ${ORIG_IMAGE}"
                        kubectl set image -n "${APP_NAMESPACE}" "${APP_KIND}/${TARGET}" "${CONTAINER}=${ORIG_IMAGE}"
                    env:
                      - name: APP_NAMESPACE
                        value: ""
                      - name: APP_LABEL
                        value: ""
                      - name: APP_KIND
                        value: "deployment"
                      - name: TARGET_CONTAINER
                        value: ""
                      - name: INVALID_IMAGE
                        value: "quay.io/it-bench/hello-bench-invalid:1.0.0"
                      - name: TOTAL_CHAOS_DURATION
                        value: "300"
                    labels:
                      name: nonexistent-kubernetes-workload-container-image
                      app.kubernetes.io/part-of: litmus
                      app.kubernetes.io/component: experiment-job
                      app.kubernetes.io/version: ci
      container:
        image: litmuschaos/k8s:latest
        command:
          - sh
          - "-c"
        args:
          - kubectl apply -f /tmp/ -n {{workflow.parameters.adminModeNamespace}} && sleep 10

    # ── Scenario templates ──────────────────────────────────────────────────

    # Scenario #58 — accounting scaled to zero
    # ChaosEngine name includes {{workflow.name}} to avoid collisions across
    # workflow runs and {{inputs.parameters.runIndex}} for per-run uniqueness.
    - name: scenario-58-run
      inputs:
        parameters:
          - name: runIndex
        artifacts:
          - name: scenario-58-run
            path: /tmp/chaosengine.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  generateName: "{{workflow.name}}-s58r{{inputs.parameters.runIndex}}-"
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  annotations:
                    probeRef: "[]"
                spec:
                  appinfo:
                    appns: 'otel-demo'
                    applabel: 'opentelemetry.io/name=accounting'
                    appkind: 'deployment'
                  engineState: 'active'
                  chaosServiceAccount: litmus-admin
                  jobCleanUpPolicy: 'retain'
                  experiments:
                    - name: scaled-to-zero-kubernetes-workload
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: '{{workflow.parameters.faultDuration}}'
      container:
        image: litmuschaos/litmus-checker:latest
        args: ["-file=/tmp/chaosengine.yaml", "-saveName=/tmp/engine-name"]

    # Scenario #20 — product-catalog nonexistent container image
    - name: scenario-20-run
      inputs:
        parameters:
          - name: runIndex
        artifacts:
          - name: scenario-20-run
            path: /tmp/chaosengine.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  generateName: "{{workflow.name}}-s20r{{inputs.parameters.runIndex}}-"
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  annotations:
                    probeRef: "[]"
                spec:
                  appinfo:
                    appns: 'otel-demo'
                    applabel: 'opentelemetry.io/name=product-catalog'
                    appkind: 'deployment'
                  engineState: 'active'
                  chaosServiceAccount: litmus-admin
                  jobCleanUpPolicy: 'retain'
                  experiments:
                    - name: nonexistent-kubernetes-workload-container-image
                      spec:
                        components:
                          env:
                            - name: TARGET_CONTAINER
                              value: 'product-catalog'
                            - name: INVALID_IMAGE
                              value: 'quay.io/it-bench/hello-bench-invalid:1.0.0'
                            - name: TOTAL_CHAOS_DURATION
                              value: '{{workflow.parameters.faultDuration}}'
      container:
        image: litmuschaos/litmus-checker:latest
        args: ["-file=/tmp/chaosengine.yaml", "-saveName=/tmp/engine-name"]

    # ── Utility templates ───────────────────────────────────────────────────

    # Brief cluster-stabilisation pause between runs
    - name: inter-run-wait
      container:
        image: alpine:3.19
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
        command: [sh, -c, "sleep {{workflow.parameters.interRunPause}}"]

    # Optional: uninstall the agent Helm release after the last run
    - name: delete-agent
      container:
        image: agentcert/agentcert-install-agent:latest
        imagePullPolicy: Always
        args:
          - "-folder={{workflow.parameters.agentFolder}}"
          - "-namespace={{workflow.parameters.appNamespace}}"
          - "-delete"
