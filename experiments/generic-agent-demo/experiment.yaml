apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: argowf-chaos-generic-agent-demo
  namespace: litmus
  labels:
    subject: "generic-agent-demo"
spec:
  entrypoint: argowf-chaos
  serviceAccountName: argo-chaos
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  arguments:
    parameters:
      - name: adminModeNamespace
        value: "litmus"
      - name: appNamespace
        value: "sock-shop"
      # Swapping agents on this benchmark is this one value.
      - name: agentFolder
        value: "generic-agent"
      - name: installTimeout
        value: "20m"
      # Populated by the control plane at experiment-save time.
      - name: openaiApiKey
        value: ""
      - name: openaiModel
        value: "gpt-4o"
      - name: openaiBaseUrl
        value: "http://litellm.ace.svc.cluster.local:14000/v1"
      - name: litellmUpstream
        value: "http://litellm.ace.svc.cluster.local:14000"
      # 0 = single pass. Raise it to keep the agent polling across the whole
      # fault window instead of exiting after one analysis.
      - name: scanInterval
        value: "60"
      - name: faultName
        value: "pod-delete"
  templates:
    - name: argowf-chaos
      steps:
        - - name: install-application
            template: install-application
        - - name: install-agent
            template: install-agent
        - - name: install-chaos-faults
            template: install-chaos-faults
        # ── fault window opens ────────────────────────────────────────────────
        - - name: open-fault-window
            template: set-current-fault
            arguments:
              parameters:
                - name: faultName
                  value: "{{workflow.parameters.faultName}}"
        - - name: pod-delete
            template: pod-delete
        - - name: close-fault-window
            template: set-current-fault
            arguments:
              parameters:
                - name: faultName
                  value: ""
        # ── fault window closes ───────────────────────────────────────────────
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: install-application
      container:
        image: agentcert/agentcert-install-app:latest
        imagePullPolicy: IfNotPresent
        args: ["-folder=sock-shop", "-namespace=sock-shop", "-create-namespace", "-wait", "-timeout=30m"]

    # Generic across every agent: only -folder changes. The control plane
    # appends ~40 more --set agent.config.* args to this template at save time.
    - name: install-agent
      container:
        image: agentcert/agentcert-install-agent:latest
        imagePullPolicy: IfNotPresent
        args:
          - "-folder={{workflow.parameters.agentFolder}}"
          - "-namespace={{workflow.parameters.appNamespace}}"
          - "-create-namespace"
          - "-timeout={{workflow.parameters.installTimeout}}"
          - "--set=agent.secret.OPENAI_API_KEY={{workflow.parameters.openaiApiKey}}"
          - "--set=agent.config.MODEL_ALIAS={{workflow.parameters.openaiModel}}"
          - "--set=agent.config.OPENAI_BASE_URL={{workflow.parameters.openaiBaseUrl}}"
          - "--set=agent.config.SCAN_INTERVAL={{workflow.parameters.scanInterval}}"
          - "--set=agent.notifyId={{workflow.name}}"
          - "--set=agent.workflowUid={{workflow.uid}}"
          - "--set=sidecar.upstream={{workflow.parameters.litellmUpstream}}"

    # Stamps the active fault onto the agent's ConfigMap. The sidecar re-reads
    # /etc/agent/metadata on every request, so each LLM call carries the fault
    # it actually fell in — this is what lets the certifier's Phase 0 bucket a
    # multi-fault trace on ground truth instead of inferring it from spans.
    # An empty value means "no fault active", which is a distinct signal from
    # the key never existing.
    - name: set-current-fault
      inputs:
        parameters:
          - name: faultName
      container:
        image: litmuschaos/k8s:latest
        command: [sh, -c]
        args:
          - >-
            kubectl patch configmap {{workflow.parameters.agentFolder}}-metadata
            -n {{workflow.parameters.appNamespace}} --type merge
            -p '{"data":{"CURRENT_FAULT_NAME":"{{inputs.parameters.faultName}}"}}'

    - name: install-chaos-faults
      inputs:
        artifacts:
          - name: pod-delete
            path: /tmp/pod-delete.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                description:
                  message: |
                    Deletes a pod belonging to a deployment/statefulset/daemonset
                kind: ChaosExperiment
                metadata:
                  name: pod-delete
                  labels:
                    name: pod-delete
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: chaosexperiment
                    app.kubernetes.io/version: latest
                spec:
                  definition:
                    scope: Namespaced
                    permissions:
                      - apiGroups: [""]
                        resources: ["pods"]
                        verbs: ["create", "delete", "get", "list", "patch", "update", "deletecollection"]
                      - apiGroups: [""]
                        resources: ["events"]
                        verbs: ["create", "get", "list", "patch", "update"]
                      - apiGroups: [""]
                        resources: ["configmaps"]
                        verbs: ["get", "list"]
                      - apiGroups: [""]
                        resources: ["pods/log"]
                        verbs: ["get", "list", "watch"]
                      - apiGroups: [""]
                        resources: ["pods/exec"]
                        verbs: ["get", "list", "create"]
                      - apiGroups: ["apps"]
                        resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
                        verbs: ["list", "get"]
                      - apiGroups: [""]
                        resources: ["replicationcontrollers"]
                        verbs: ["get", "list"]
                      - apiGroups: ["batch"]
                        resources: ["jobs"]
                        verbs: ["create", "list", "get", "delete", "deletecollection"]
                      - apiGroups: ["litmuschaos.io"]
                        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
                        verbs: ["create", "list", "get", "patch", "update", "delete"]
                    image: "litmuschaos.docker.scarf.sh/litmuschaos/go-runner:latest"
                    imagePullPolicy: Always
                    args:
                      - -c
                      - ./experiments -name pod-delete
                    command:
                      - /bin/bash
                    env:
                      - name: TOTAL_CHAOS_DURATION
                        value: "300"
                      - name: RAMP_TIME
                        value: ""
                      - name: FORCE
                        value: "true"
                      - name: CHAOS_INTERVAL
                        value: "10"
                      - name: PODS_AFFECTED_PERC
                        value: ""
                      - name: TARGET_CONTAINER
                        value: ""
                      - name: TARGET_PODS
                        value: ""
                      - name: DEFAULT_HEALTH_CHECK
                        value: "false"
                      - name: NODE_LABEL
                        value: ""
                      - name: SEQUENCE
                        value: "parallel"
                    labels:
                      name: pod-delete
                      app.kubernetes.io/part-of: litmus
                      app.kubernetes.io/component: experiment-job
                      app.kubernetes.io/version: latest
      container:
        image: litmuschaos/k8s:latest
        command: [sh, -c]
        args:
          - kubectl apply -f /tmp/ -n {{workflow.parameters.adminModeNamespace}} && sleep 30

    - name: pod-delete
      inputs:
        artifacts:
          - name: pod-delete
            path: /tmp/chaosengine.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  name: catalogue-pod-delete-chaos
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  labels:
                    context: "{{workflow.parameters.appNamespace}}_catalogue"
                  annotations:
                    probeRef: '[]'
                spec:
                  appinfo:
                    appns: 'sock-shop'
                    applabel: 'name=catalogue'
                    appkind: 'deployment'
                  engineState: 'active'
                  chaosServiceAccount: litmus-admin
                  jobCleanUpPolicy: 'retain'
                  components:
                    runner:
                      imagePullPolicy: Always
                  experiments:
                    - name: pod-delete
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: '300'
                            - name: CHAOS_INTERVAL
                              value: '10'
                            - name: FORCE
                              value: 'false'
      container:
        image: litmuschaos/litmus-checker:latest
        args: ["-file=/tmp/chaosengine.yaml", "-saveName=/tmp/engine-name"]

    - name: cleanup-chaos-resources
      container:
        image: litmuschaos/k8s:latest
        command: [sh, -c]
        args:
          - kubectl delete chaosengine catalogue-pod-delete-chaos -n {{workflow.parameters.adminModeNamespace}}
