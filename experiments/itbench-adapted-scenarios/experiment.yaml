      - sh
      - -c
      args:
      - kubectl apply -f /tmp/chaos-mesh-http-abort-replacement.yaml -n {{workflow.parameters.adminModeNamespace}} && kubectl
        apply -f /tmp/chaos-mesh-http-body-tamper-replacement.yaml -n {{workflow.parameters.adminModeNamespace}} && kubectl
