---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-network-latency
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: NETWORK_INTERFACE
    label: Network interface
    type: string
    group: Injection
    advanced: true
  - key: NETWORK_LATENCY
    label: Network latency
    type: integer
    min: 0
    required: true
    group: Injection
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: JITTER
    label: Jitter
    type: integer
    min: 0
    required: true
    group: Injection
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: string
    pattern: '^((100|[1-9]?[0-9])(-(100|[1-9]?[0-9]))?)?$'
    required: false
    group: Injection
    description: >-
      A percentage, or a range such as 50-100 (a random value in it is used;
      lower bound first). Empty uses the runner default.
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: DESTINATION_IPS
    label: Destination ips
    type: string
    group: Injection
  - key: DESTINATION_HOSTS
    label: Destination hosts
    type: string
    group: Injection
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    - random
    group: Injection
    description: Choosing random picks serial or parallel at run time.
  displayName: Pod Network Latency
  categoryDescription: |
    Pod-network-latency fault disrupts network connectivity of Kubernetes pods. This fault injects random network delays on the app replica pods.
    - Causes flaky access to application replica by injecting network delay using Pumba.
    - The application pod should be healthy once chaos is stopped. Service-requests should be served despite chaos.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Minikube
    - Packet(Kubeadm)
    - EKS
    - AKS
  maintainers:
    - name: ksatchit
      email: karthik.s@harness.io
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
