---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Removes an AI agent's Helm release from the Kubernetes cluster after a run.

    Implemented as a real litmus-go SDK experiment binary (bin/itbench-experiment,
    -name uninstall-agent; source: experiments/itbench/uninstall-agent/experiment)
    rather than a raw helm-wrapper container -- so it reports a real ChaosResult
    (SOT/EOT, verdict Pass on success) via pkg/result instead of the operator/UI
    always showing Fail/0% regardless of whether the teardown actually worked.

    Release-scoped, not namespace-scoped: the agent frequently shares the target
    application's namespace, so this deletes only the objects Helm recorded for
    release FOLDER (the app.kubernetes.io/managed-by=Helm label plus the
    meta.helm.sh/release-name annotation Helm stamps on every managed object),
    plus Helm's own release-state Secrets. Full namespace teardown is the
    uninstall-application step's job.
kind: ChaosExperiment
metadata:
  name: uninstall-agent
  annotations:
    probeRef: '[]'
  labels:
    name: uninstall-agent
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Cluster
    permissions:
      # litmus-go SDK: ChaosResult lifecycle + events
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: [""]
        resources: ["pods", "pods/log"]
        verbs: ["get", "list", "watch"]
      # Helm-release sweep: list + delete the kinds an ACE agent chart can create
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
        verbs: ["get", "list", "delete"]
      - apiGroups: [""]
        resources:
          ["services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["batch"]
        resources: ["jobs", "cronjobs"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["autoscaling"]
        resources: ["horizontalpodautoscalers"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["ingresses", "networkpolicies"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["policy"]
        resources: ["poddisruptionbudgets"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources:
          ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
        verbs: ["get", "list", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - uninstall-agent
    env:
      # Helm release name of the agent to remove (== AgentHub chart folder by convention)
      - name: FOLDER
        value: ""

      # namespace the agent release was installed into
      - name: NAMESPACE
        value: ""

    labels:
      name: uninstall-agent
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
