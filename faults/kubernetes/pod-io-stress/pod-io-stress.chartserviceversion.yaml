---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-io-stress
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: FILESYSTEM_UTILIZATION_PERCENTAGE
    label: Filesystem utilization percentage
    type: integer
    min: 0
    max: 100
    required: true
    group: Injection
  - key: FILESYSTEM_UTILIZATION_BYTES
    label: Filesystem utilization bytes
    type: integer
    min: 0
    required: false
    group: Injection
  - key: NUMBER_OF_WORKERS
    label: Number of workers
    type: integer
    min: 1
    required: true
    group: Injection
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: VOLUME_MOUNT_PATH
    label: Volume mount path
    type: string
    group: Injection
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  displayName: Pod IO Stress
  categoryDescription: |
    This fault causes disk IO stress on the application pod. It aims to verify the resiliency of applications that share this disk resource for ephemeral or persistent storage purposes.
    - Consumes the disk available by executing filesystem IO stress as available memory or by providing the value in GB.
    - The application pod should be healthy once chaos is stopped. Expectation is that service-requests should be served despite chaos.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Packet(Kubeadm)
    - Minikube
    - EKS
    - AKS
  maintainers:
    - name: Udit Gaurav
      email: udit.gaurav@harness.io
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
