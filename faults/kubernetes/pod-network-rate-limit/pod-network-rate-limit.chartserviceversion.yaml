---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-network-rate-limit
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: NETWORK_INTERFACE
    label: Network interface
    type: string
    group: Injection
    advanced: true
  - key: NETWORK_BANDWIDTH
    label: Network bandwidth
    type: string
    group: Injection
  - key: BURST
    label: Burst
    type: string
    group: Injection
  - key: LIMIT
    label: Limit
    type: string
    group: Injection
  - key: MIN_BURST
    label: Min burst
    type: string
    group: Injection
  - key: PEAK_RATE
    label: Peak rate
    type: string
    group: Injection
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: DESTINATION_IPS
    label: Destination ips
    type: string
    group: Injection
  - key: DESTINATION_HOSTS
    label: Destination hosts
    type: string
    group: Injection
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  displayName: Pod Network Rate Limit
  categoryDescription: |
    Pod-network-rate-limit fault add the network rate limit to kubernetes pods
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Minikube
    - Packet(Kubeadm)
    - EKS
  maintainers:
    - name: Neelanjan Manna
      email: neelanjan.manna@harness.io
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Permissions
      url: https://developer.harness.io/docs/chaos-engineering/use-harness-ce/chaos-faults/kubernetes/pod/pod-network-rate-limit/#permissions-required
  icon:
    - base64data: ""
      mediatype: ""
