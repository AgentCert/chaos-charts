---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-dns-error
  version: 0.1.0
  annotations:
    categories: kubernetes
spec:
  configurations:
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  - key: TARGET_HOSTNAMES
    label: Target hostnames
    type: string
    group: Target
  - key: MATCH_SCHEME
    label: Match scheme
    type: string
    group: Injection
  displayName: Pod DNS Error
  categoryDescription: >
    Pod DNS Error fault injects DNS failure/error in target pod containers.
  keywords:
    - Kubernetes
  maintainers:
    - name: gdsoumya
      email: gdsoumya@gmail.com
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
