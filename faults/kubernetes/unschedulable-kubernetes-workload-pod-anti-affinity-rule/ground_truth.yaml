fault: unschedulable-kubernetes-workload-pod-anti-affinity-rule
version: 0.1.0
description: >-
  Patches a Deployment/StatefulSet's pod template with a
  requiredDuringSchedulingIgnoredDuringExecution inter-pod anti-affinity rule
  against its own label that the cluster's node topology cannot satisfy,
  leaving replacement pods permanently Pending. Mirrors ITBench SRE scenario
  44 (unschedulable-kubernetes-workload-pod-anti-affinity-rule against
  OpenTelemetry Demo's `payment` service).

ground_truth:
  fault_description_goal_remediation:
    symptoms:
      - "New/replacement pod(s) for the target workload are stuck in `Pending` state"
      - "FailedScheduling warning event: pod 'didn't match pod anti-affinity rules'"
      - "KubePodNotReady alert fires for the affected workload"
      - "Deployment shows fewer available/ready replicas than desired"
      - "kubectl describe pod shows 0/N nodes are available due to pod anti-affinity"

    goal: >
      Patch a workload's pod template with an unsatisfiable required
      inter-pod anti-affinity rule to validate whether an agent detects the
      resulting FailedScheduling/KubePodNotReady signals, identifies the
      offending anti-affinity rule in the Deployment spec, and removes or
      corrects it so pods can schedule again.

    remediation: >
      Remove or correct the faulty requiredDuringSchedulingIgnoredDuringExecution
      podAntiAffinity rule (e.g. via `kubectl rollout undo` or by editing the
      Deployment/StatefulSet spec) so the scheduler can place the pod on a
      node and it reaches Running/Ready.

  ideal_course_of_action:
    - step: 1
      action: "List namespaces"
      detail: "Enumerate cluster namespaces to identify where the affected application is deployed."

    - step: 2
      action: "List deployments and pods in target namespace"
      detail: "List Deployments/StatefulSets and pods in the application namespace and note which pod(s) are stuck Pending."

    - step: 3
      action: "Get pod details"
      detail: "Retrieve pod status/conditions to confirm the pod is Pending with a FailedScheduling reason."

    - step: 4
      action: "Check Kubernetes events"
      detail: "List events in the namespace; look for a FailedScheduling event citing 'didn't match pod anti-affinity rules'."

    - step: 5
      action: "Inspect deployment spec"
      detail: "Read the Deployment/StatefulSet spec.template.spec.affinity.podAntiAffinity and note the unsatisfiable requiredDuringSchedulingIgnoredDuringExecution rule (topologyKey=kubernetes.io/hostname against its own label)."

    - step: 6
      action: "Check Prometheus alerts/metrics"
      detail: "Query for KubePodNotReady and pod phase metrics correlated with this service to confirm the pod is not Running."

    - step: 7
      action: "Remove or fix the anti-affinity rule"
      detail: "Either rollout undo the Deployment/StatefulSet or patch out the offending podAntiAffinity rule from the pod template."

    - step: 8
      action: "Verify pod recovery"
      detail: "Re-list pods to confirm the replacement pod is scheduled and reaches Running/Ready."

  ideal_tool_usage_trajectory:
    - step: 1
      tool: "Namespaces: List"
      command: "Namespaces: List"
      purpose: "Locate the namespace hosting the affected application."
      tool_available: true

    - step: 2
      tool: "Resources: List"
      command: "Resources: List apiVersion=apps/v1 kind=Deployment namespace=<target-namespace>"
      purpose: "Find the Deployment whose pod is stuck Pending."
      tool_available: true

    - step: 3
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=<target-namespace>"
      purpose: "Identify the pod(s) stuck in Pending state."
      tool_available: true

    - step: 4
      tool: "Events: List"
      command: "Events: List namespace=<target-namespace>"
      purpose: "Find the FailedScheduling event explaining the anti-affinity mismatch."
      tool_available: true

    - step: 5
      tool: "Resources: Get"
      command: "Resources: Get apiVersion=apps/v1 kind=Deployment namespace=<target-namespace> name=<deployment-name>"
      purpose: "Read the Deployment spec and confirm the unsatisfiable podAntiAffinity rule."
      tool_available: true

    - step: 6
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='kube_pod_status_phase{namespace=\"<target-namespace>\",phase=\"Pending\"}'"
      purpose: "Confirm the pod has been stuck Pending via Prometheus."
      tool_available: true

    - step: 7
      tool: "Rollback Deployment"
      command: "Rollback Deployment namespace=<target-namespace> name=<deployment-name>"
      purpose: "Restore the previous revision to remove the faulty anti-affinity rule."
      tool_available: true

    - step: 8
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=<target-namespace>"
      purpose: "Verify the replacement pod is scheduled and reaches Running/Ready."
      tool_available: true

  sla:
    time_to_detect:
      description: "Max time from fault injection to first correct symptom identification"
      threshold: 60
      unit: "seconds"

    time_to_mitigate:
      description: "Max time from fault injection to successful remediation"
      threshold: 120
      unit: "seconds"

    max_tool_calls:
      description: "Max total tool invocations allowed (including retries)"
      threshold: 14
      unit: "count"
