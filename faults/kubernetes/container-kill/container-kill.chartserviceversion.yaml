---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: container-kill
  version: 0.1.0
  annotations:
    categories: "Kubernetes"
    vendor: LitmusChaos
spec:
  configurations:
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: CHAOS_INTERVAL
    label: Chaos interval
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: SIGNAL
    label: Signal
    type: string
    group: Injection
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  displayName: Container Kill
  categoryDescription: |
    Container kill fault disrupts state of kubernetes resources. This fault injects random container delete failures against specified application.
     - Executes SIGKILL on containers of random replicas of an application deployment.
     - Tests deployment sanity (replica availability & uninterrupted service) and recovery workflows of the application pod.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Minikube
    - Packet(Kubeadm)
    - EKS
    - AKS
  maintainers:
    - name: ksatchit
      email: karthik.s@harness.io
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - url:
      mediatype: ""
