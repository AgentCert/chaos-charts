---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-memory-hog
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: MEMORY_CONSUMPTION
    label: Memory consumption
    type: integer
    min: 0
    required: true
    group: Injection
  - key: NUMBER_OF_WORKERS
    label: Number of workers
    type: integer
    min: 1
    required: true
    group: Injection
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: STRESS_IMAGE
    label: Stress image
    type: string
    group: Injection
    advanced: true
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  displayName: Pod Memory Hog
  categoryDescription: |
    Pod-Memory-Hog fault consumes memory resources of specified containers in Kubernetes pods.
    - Causes memory resource consumption on specified application containers using cgroups and litmus nsutil that consume memory resources of the given target containers.
    - It tests the application's resilience to potential slowness/unavailability of some replicas due to high memory load.
    - The application pod should be healthy once chaos is stopped. Expectation is that service-requests should be served despite chaos.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Packet(Kubeadm)
    - Minikube
    - EKS
    - AKS
    - OpenShift(OKD)
  maintainers:
    - name: Udit Gaurav
      email: udit.gaurav@harness.io
  experiments:
    - pod-memory-hog
    - sock-shop
    - sock-shop-promProbe
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
