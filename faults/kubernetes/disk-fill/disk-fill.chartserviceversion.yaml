---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: disk-fill
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
    support: https://slack.kubernetes.io/
spec:
  configurations:
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: FILL_PERCENTAGE
    label: Fill percentage
    type: string
    pattern: '^(100|[1-9][0-9]?)(-(100|[1-9][0-9]?))?$'
    required: true
    group: Injection
    description: >-
      Percentage of the ephemeral storage limit to fill. The runner rejects
      anything outside 1..100. A range such as 50-90 picks a random value in
      it (lower bound first).
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: DATA_BLOCK_SIZE
    label: Data block size
    type: integer
    min: 1
    required: true
    group: Injection
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: EPHEMERAL_STORAGE_MEBIBYTES
    label: Ephemeral storage mebibytes
    type: string
    pattern: '^([0-9]+(-[0-9]+)?)?$'
    required: false
    group: Injection
    description: >-
      A whole number, or a range such as 256-512 (a random value in it is
      used; lower bound first). Empty uses the runner default.
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: string
    pattern: '^((100|[1-9]?[0-9])(-(100|[1-9]?[0-9]))?)?$'
    required: false
    group: Injection
    description: >-
      A percentage, or a range such as 50-100 (a random value in it is used;
      lower bound first). Empty uses the runner default.
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    - random
    group: Injection
    description: Choosing random picks serial or parallel at run time.
  displayName: Disk Fill
  categoryDescription: |
    Disk fill fault disrupts state of kubernetes resources.
    - Causes (forced/graceful) Disk Stress by filling up the Ephemeral Storage of the Pod using one of it containers.
    - Causes Pod to get Evicted if the Pod exceeds it Ephemeral Storage Limit.
    - Tests the Ephemeral Storage Limits, to ensure those parameters are sufficient.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - EKS
    - AKS
  maintainers:
    - name: ksatchit
      email: karthik.s@harness.io
  experiments:
    - sock-shop
    - sock-shop-promProbe
  chaosType: infra
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - url:
      mediatype: ""
