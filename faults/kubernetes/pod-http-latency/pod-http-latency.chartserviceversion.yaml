---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-http-latency
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: LATENCY
    label: Latency
    type: integer
    min: 0
    required: true
    group: Injection
  - key: TARGET_SERVICE_PORT
    label: Target service port
    type: integer
    min: 1
    max: 65535
    required: true
    group: Target
  - key: TOXICITY
    label: Toxicity
    type: integer
    min: 0
    max: 100
    required: true
    group: Injection
  - key: PROXY_PORT
    label: Proxy port
    type: integer
    min: 1
    max: 65535
    required: true
    group: Injection
  - key: NETWORK_INTERFACE
    label: Network interface
    type: string
    group: Injection
    advanced: true
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  displayName: Pod HTTP Latency
  categoryDescription: |
    Pod-http-latency fault disrupts HTTP requests of kubernetes pods. This fault can inject random HTTP response delays on the app replica pods.
    - Causes flaky access to application replica by injecting HTTP response delay using toxiproxy.
    - The application pod should be healthy once chaos is stopped. Service-requests should be served despite chaos.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Minikube
    - EKS
  maintainers:
    - name: Akash Shrivastava
      email: akash.shrivastava@harness.io
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
