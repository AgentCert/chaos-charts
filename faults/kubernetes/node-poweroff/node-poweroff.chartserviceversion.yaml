---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: node-poweroff
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  # The runner interpolates SSH_USER, TARGET_NODE_IP and REBOOT_COMMAND,
  # unquoted, into `sh -c "... ssh -i <key> $SSH_USER@$IP $REBOOT_COMMAND"`
  # (chaoslib/litmus/node-restart/lib/node-restart.go). SSH_USER and
  # TARGET_NODE_IP are offered only behind patterns that admit no whitespace or
  # shell metacharacters. REBOOT_COMMAND is deliberately NOT offered: editing it
  # would be arbitrary command execution on a cluster node, so it stays pinned
  # to its fault.yaml default.
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: TARGET_NODE
    label: Target node
    type: string
    group: Target
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: TARGET_NODE_IP
    label: Target node ip
    type: string
    pattern: '^[A-Za-z0-9.:-]*$'
    group: Target
    description: >-
      An IP address or hostname. Empty uses the target node's InternalIP.
  - key: SSH_USER
    label: SSH user
    type: string
    pattern: '^[a-z_][a-z0-9_-]{0,31}$'
    required: true
    group: Injection
    description: >-
      Login user for SSH to the node, e.g. azureuser on AKS or ec2-user on
      EKS. The fixed reboot command runs through sudo, so a non-root user
      needs passwordless sudo on the node.
  displayName: Node Poweroff
  categoryDescription: |
    Node poweroff contains chaos experiment to poweroff a node via SSH.
  keywords:
    - Kubernetes
  platforms:
    - KVM/LibVirt based K8s
    - EKS
  maintainers:
    - name: jordigilh
      email: jordi.gil@gmail.com
  chaosType: infra
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - url: ""
      mediatype: ""
