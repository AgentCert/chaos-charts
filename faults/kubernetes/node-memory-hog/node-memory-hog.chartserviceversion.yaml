---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: node-memory-hog
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: MEMORY_CONSUMPTION_PERCENTAGE
    label: Memory consumption percentage
    type: string
    pattern: '^((100|[1-9]?[0-9])(-(100|[1-9]?[0-9]))?)?$'
    required: false
    group: Injection
    description: >-
      A percentage, or a range such as 50-100 (a random value in it is used;
      lower bound first). Empty uses the runner default.
  - key: MEMORY_CONSUMPTION_MEBIBYTES
    label: Memory consumption mebibytes
    type: string
    pattern: '^([0-9]+(-[0-9]+)?)?$'
    required: false
    group: Injection
    description: >-
      A whole number, or a range such as 256-512 (a random value in it is
      used; lower bound first). Empty uses the runner default.
  - key: NUMBER_OF_WORKERS
    label: Number of workers
    type: string
    pattern: '^[1-9][0-9]*(-[1-9][0-9]*)?$'
    required: true
    group: Injection
    description: >-
      A whole number, or a range such as 1-4 (a random value in it is used;
      lower bound first).
  - key: TARGET_NODES
    label: Target nodes
    type: string
    group: Target
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: NODES_AFFECTED_PERC
    label: Nodes affected (%)
    type: string
    pattern: '^((100|[1-9]?[0-9])(-(100|[1-9]?[0-9]))?)?$'
    required: false
    group: Injection
    description: >-
      A percentage, or a range such as 50-100 (a random value in it is used;
      lower bound first). Empty uses the runner default.
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    - random
    group: Injection
    description: Choosing random picks serial or parallel at run time.
  displayName: Node Memory Hog
  categoryDescription: |
    Kubernetes Node memory hog fault disrupts the state of Kubernetes resources. This fault injects a memory spike on a node where the application pod is scheduled.
    - Memory hog on a particular node where the application deployment is available.
    - After the test, the recovery should be manual for the application pod and node in case they are not in an appropriate state.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - EKS
    - AKS
    - Kind
    - Rancher
    - OpenShift(OKD)
  maintainers:
    - name: Udit Gaurav
      email: udit.gaurav@harness.io
  experiments:
    - node-memory-hog
  chaosType: infra
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - url: ""
      mediatype: ""
