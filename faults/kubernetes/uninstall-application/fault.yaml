---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Tears the target application down completely after a run.

    Implemented as a real litmus-go SDK experiment binary (bin/itbench-experiment,
    -name uninstall-application; source:
    experiments/itbench/uninstall-application/experiment) rather than a raw
    helm-wrapper container -- so it reports a real ChaosResult (SOT/EOT, verdict
    Pass on success) via pkg/result instead of the operator/UI always showing
    Fail/0% regardless of whether the teardown actually worked.

    Two-stage so teardown is complete regardless of what ran or succeeded during
    the experiment:
      1. Remove the app's Helm release (release-scoped -- also catches the chart's
         cluster-scoped objects, ClusterRole/ClusterRoleBinding, which a namespace
         delete alone would leave behind).
      2. Delete namespace NAMESPACE, cascading to every remaining namespaced
         object: fault leftovers (NetworkPolicies, patched workloads), orphaned
         PVCs, leftover ChaosEngine/ChaosResult CRs, a half-installed agent
         release, etc.
kind: ChaosExperiment
metadata:
  name: uninstall-application
  annotations:
    probeRef: '[]'
  labels:
    name: uninstall-application
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Cluster
    permissions:
      # litmus-go SDK: ChaosResult lifecycle + events
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: [""]
        resources: ["pods", "pods/log"]
        verbs: ["get", "list", "watch"]
      # Stage 2: delete the namespace outright (cascades to everything in it)
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "delete"]
      # Stage 1: Helm-release sweep -- list + delete the kinds an ACE app chart can create
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
        verbs: ["get", "list", "delete"]
      - apiGroups: [""]
        resources:
          ["services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["batch"]
        resources: ["jobs", "cronjobs"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["autoscaling"]
        resources: ["horizontalpodautoscalers"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["ingresses", "networkpolicies"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["policy"]
        resources: ["poddisruptionbudgets"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources:
          ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
        verbs: ["get", "list", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - uninstall-application
    env:
      # Helm release name of the app to remove (== AppHub chart folder / namespace by convention)
      - name: FOLDER
        value: ""

      # namespace to tear down
      - name: NAMESPACE
        value: ""

    labels:
      name: uninstall-application
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
