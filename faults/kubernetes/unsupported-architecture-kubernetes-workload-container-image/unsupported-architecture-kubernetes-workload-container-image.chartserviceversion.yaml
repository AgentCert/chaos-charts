---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: unsupported-architecture-kubernetes-workload-container-image
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: ITBench
    chartDescription: >-
      Sets a container's image to a tag built only for an unsupported CPU
      architecture, causing the pod to become stuck Pending in
      ImagePullBackOff, then restores the original image. Mirrors ITBench
      SRE scenarios 23, 57 and 60
      (unsupported-architecture-kubernetes-workload-container-image).
spec:
  displayName: Unsupported Architecture Kubernetes Workload Container Image
  categoryDescription: |
    Unsupported architecture container image fault disrupts a Kubernetes
    workload by setting its container's image to a tag published only for a
    CPU architecture the cluster's nodes do not support (e.g. an arm64-only
    image on amd64 nodes).
    - Simulates a bad multi-arch build/publish or an incorrect image
      reference picked up during a deploy.
    - Pods enter Pending/ImagePullBackOff ("no matching manifest for
      linux/amd64"), triggering KubePodNotReady/KubeContainerWaiting.
    - Tests whether an agent distinguishes an architecture mismatch from a
      generic missing-tag failure and restores a compatible image.
  keywords:
    - Kubernetes
    - ITBench
  platforms:
    - GKE
    - AKS
    - EKS
    - Kind
    - Minikube
  maintainers:
    - name: AgentCert Team
      email: agentcert@microsoft.com
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: ITBench
      url: https://github.com/itbench-hub/ITBench
  icon:
    - url: ""
      mediatype: ""
