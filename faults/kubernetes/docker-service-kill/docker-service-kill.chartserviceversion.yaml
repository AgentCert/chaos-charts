---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: docker-service-kill
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: TARGET_NODE
    label: Target node
    type: string
    group: Target
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  displayName: Docker Service Kill
  categoryDescription: |
    docker-service-kill fault kills the Docker service gracefully for a certain chaos duration.
    - Causes replicas to be evicted or become unreachable on account of nodes turning unschedulable (Not Ready) due to Docker service kill.
    - The application node should be healthy once the chaos is stopped and the services are re-accessable.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - AKS
  maintainers:
    - name: Ankur Ghosh
      email: ankur.ghosh3@wipro.com
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
