---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Creates a NetworkPolicy that denies all ingress traffic to a Deployment/
    StatefulSet's pods (identified by label), holds it for the chaos
    duration, then deletes the NetworkPolicy to restore connectivity.
    Mirrors ITBench SRE fault library index 6
    "ingress-port-blocking-network-policy" (scenario 31: otel-demo frontend).
kind: ChaosExperiment
metadata:
  name: ingress-port-blocking-network-policy
  labels:
    name: ingress-port-blocking-network-policy
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["networkpolicies"]
        verbs: ["create", "get", "list", "delete"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "litmuschaos/k8s:latest"
    imagePullPolicy: Always
    command:
      - /bin/sh
    args:
      - -c
      - |
        set -eu
        echo "Resolving target ${APP_KIND} in ns=${APP_NAMESPACE} label=${APP_LABEL}"
        TARGET=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" -l "${APP_LABEL}" -o jsonpath='{.items[0].metadata.name}')
        if [ -z "$TARGET" ]; then
          echo "no ${APP_KIND} found matching label ${APP_LABEL} in ${APP_NAMESPACE}" >&2
          exit 1
        fi
        echo "Target=${TARGET}"

        # APP_LABEL is a single "key=value" selector (the otel-demo convention
        # is 'opentelemetry.io/name=<component>', applied to both the workload
        # and its pod template) -- split it to build the NetworkPolicy's
        # podSelector so it targets exactly the pods backing ${TARGET}.
        LABEL_KEY=${APP_LABEL%%=*}
        LABEL_VALUE=${APP_LABEL#*=}
        NETPOL_NAME=${NETPOL_NAME:-${TARGET}-ingress-block-fault}

        echo "Injecting: creating deny-all-ingress NetworkPolicy ${NETPOL_NAME} selecting ${LABEL_KEY}=${LABEL_VALUE} in ${APP_NAMESPACE}"
        cat <<EOF | kubectl apply -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${NETPOL_NAME}
          namespace: ${APP_NAMESPACE}
          labels:
            litmuschaos.io/fault: ingress-port-blocking-network-policy
        spec:
          podSelector:
            matchLabels:
              ${LABEL_KEY}: "${LABEL_VALUE}"
          policyTypes:
            - Ingress
          ingress: []
        EOF

        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
        sleep "${TOTAL_CHAOS_DURATION}"

        echo "Reverting: deleting NetworkPolicy ${NETPOL_NAME}"
        kubectl delete networkpolicy -n "${APP_NAMESPACE}" "${NETPOL_NAME}" --ignore-not-found
    env:
      # Injected by the chaos-operator from ChaosEngine.spec.appinfo
      - name: APP_NAMESPACE
        value: ""
      - name: APP_LABEL
        value: ""
      - name: APP_KIND
        value: "deployment"

      # name of the deny-all NetworkPolicy this fault creates; defaults to
      # "<target>-ingress-block-fault" if left blank, so it never collides
      # with a pre-existing, legitimately-owned NetworkPolicy
      - name: NETPOL_NAME
        value: ""

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: ingress-port-blocking-network-policy
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
