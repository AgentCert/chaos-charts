---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: ingress-port-blocking-network-policy-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  chaosServiceAccount: ingress-port-blocking-network-policy-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: ingress-port-blocking-network-policy
      spec:
        components:
          env:
            # name of the deny-all NetworkPolicy created by the fault;
            # defaults to "<target>-ingress-block-fault" if left blank
            - name: NETPOL_NAME
              value: ''
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
