---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Overwrites one named environment variable on a container with a bad
    value, then restores the original value (or removes the variable if it
    did not exist originally). Mirrors ITBench SRE scenario 16, which
    reassigns otel-demo's "shipping" container QUOTE_ADDR env var to an
    unreachable address, and fault library index 13
    (modified-kubernetes-workload-container-environment-variable).
kind: ChaosExperiment
metadata:
  name: modified-kubernetes-workload-container-environment-variable
  labels:
    name: modified-kubernetes-workload-container-environment-variable
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "litmuschaos/k8s:latest"
    imagePullPolicy: Always
    command:
      - /bin/sh
    args:
      - -c
      - |
        set -eu
        echo "Resolving target ${APP_KIND} in ns=${APP_NAMESPACE} label=${APP_LABEL}"
        TARGET=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" -l "${APP_LABEL}" -o jsonpath='{.items[0].metadata.name}')
        if [ -z "$TARGET" ]; then
          echo "no ${APP_KIND} found matching label ${APP_LABEL} in ${APP_NAMESPACE}" >&2
          exit 1
        fi
        CONTAINER="${TARGET_CONTAINER:-$TARGET}"
        echo "Target=${TARGET} container=${CONTAINER} envVar=${ENV_VAR_NAME}"

        # Determine whether the env var already exists on the container, and
        # if so, capture its original value so it can be restored exactly on
        # revert. If it did not exist, we remove it on revert instead of
        # setting it to an empty string.
        EXISTING_NAMES=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" \
          -o jsonpath="{.spec.template.spec.containers[?(@.name=='${CONTAINER}')].env[*].name}")
        EXISTED="false"
        for n in $EXISTING_NAMES; do
          if [ "$n" = "$ENV_VAR_NAME" ]; then
            EXISTED="true"
          fi
        done

        ORIG_VALUE=""
        if [ "$EXISTED" = "true" ]; then
          ORIG_VALUE=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" \
            -o jsonpath="{.spec.template.spec.containers[?(@.name=='${CONTAINER}')].env[?(@.name=='${ENV_VAR_NAME}')].value}")
          echo "Original ${ENV_VAR_NAME}=${ORIG_VALUE}"
        else
          echo "${ENV_VAR_NAME} does not currently exist on ${CONTAINER}; will remove it on revert"
        fi

        echo "Injecting: setting ${ENV_VAR_NAME}=${BAD_ENV_VALUE} on ${CONTAINER}"
        kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=strategic \
          -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"${CONTAINER}\",\"env\":[{\"name\":\"${ENV_VAR_NAME}\",\"value\":\"${BAD_ENV_VALUE}\"}]}]}}}}"

        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
        sleep "${TOTAL_CHAOS_DURATION}"

        if [ "$EXISTED" = "true" ]; then
          echo "Reverting: restoring ${ENV_VAR_NAME}=${ORIG_VALUE} on ${CONTAINER}"
          kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=strategic \
            -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"${CONTAINER}\",\"env\":[{\"name\":\"${ENV_VAR_NAME}\",\"value\":\"${ORIG_VALUE}\"}]}]}}}}"
        else
          echo "Reverting: removing ${ENV_VAR_NAME} from ${CONTAINER} (it did not exist originally)"
          kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=strategic \
            -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"${CONTAINER}\",\"env\":[{\"name\":\"${ENV_VAR_NAME}\",\"\$patch\":\"delete\"}]}]}}}}"
        fi
    env:
      # Injected by the chaos-operator from ChaosEngine.spec.appinfo
      - name: APP_NAMESPACE
        value: ""
      - name: APP_LABEL
        value: ""
      - name: APP_KIND
        value: "deployment"

      # container whose environment variable is modified; defaults to the
      # workload name if unset
      - name: TARGET_CONTAINER
        value: ""

      # environment variable to overwrite, and the bad value to inject —
      # defaults match ITBench scenario 16 (otel-demo "shipping" container's
      # QUOTE_ADDR, which is pointed at an unreachable address so it can no
      # longer reach the "quote" service)
      - name: ENV_VAR_NAME
        value: "QUOTE_ADDR"
      - name: BAD_ENV_VALUE
        value: "quote:0000"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: modified-kubernetes-workload-container-environment-variable
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
