---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-memory-hog-exec
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: MEMORY_CONSUMPTION
    label: Memory consumption
    type: integer
    min: 0
    required: true
    group: Injection
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: CHAOS_KILL_COMMAND
    label: Chaos kill command
    type: text
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  displayName: Pod Memory Hog Exec
  categoryDescription: |
    pod-memory-hog-exec fault consumes memory resources of specified containers in Kubernetes pods.
    - Consumes the memory specified by executing a dd command against special files /dev/zero(input) and /dev/null(output).
    - The application pod should be healthy once chaos is stopped. Expectation is that service-requests should be served despite chaos.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Packet(Kubeadm)
    - Minikube
    - EKS
    - AKS
    - OpenShift(OKD)
  maintainers:
    - name: Udit Gaurav
      email: udit.gaurav@harness.io
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
