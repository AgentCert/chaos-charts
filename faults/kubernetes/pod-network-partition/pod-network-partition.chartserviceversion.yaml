---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-network-partition
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: DESTINATION_IPS
    label: Destination ips
    type: string
    group: Injection
  - key: DESTINATION_HOSTS
    label: Destination hosts
    type: string
    group: Injection
  - key: POLICY_TYPES
    label: Policy types
    type: string
    group: Injection
  - key: POD_SELECTOR
    label: Pod selector
    type: string
    group: Target
  - key: NAMESPACE_SELECTOR
    label: Namespace selector
    type: string
    group: Target
  - key: PORTS
    label: Ports
    type: string
    group: Injection
  displayName: Pod Network Partition
  categoryDescription: |
    pod-network-partition fault disrupts network connectivity to kubernetes pods. This fault injects complete egress/ingress network loss based on label and namespace selectors.
    - The application pod should be healthy once chaos is stopped. Service-requests should be served (say, via alternate replicas) despite chaos.
  keywords:
    - Kubernetes
  platforms:
    - Minikube
    - Packet(Kubeadm)
  maintainers:
    - name: Shubham Chaudhary
      email: shubham.chaudhary@harness.io
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
