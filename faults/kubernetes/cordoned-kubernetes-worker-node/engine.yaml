---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: cordoned-kubernetes-worker-node-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  chaosServiceAccount: cordoned-kubernetes-worker-node-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: cordoned-kubernetes-worker-node
      spec:
        components:
          env:
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
