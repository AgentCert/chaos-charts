fault: scaled-to-zero-kubernetes-workload
version: 0.1.0
description: >-
  Scales a Deployment/StatefulSet to zero replicas, then restores its
  original replica count. Mirrors ITBench SRE scenario 58
  (scaled-to-zero-kubernetes-workload).

ground_truth:
  fault_description_goal_remediation:
    symptoms:
      - "Target Deployment/StatefulSet shows 0/0 available replicas"
      - "No pods exist for the workload; existing endpoints are removed"
      - "HighRequestErrorRate and/or NoRequestsReceived alerts for the service"
      - "Upstream callers receive connection refused / no route to host"

    goal: >
      Scale a workload's replica count to zero to validate whether an agent
      detects the resulting traffic outage and restores serving capacity.

    remediation: >
      Scale the Deployment/StatefulSet back to a healthy replica count
      (`kubectl scale` or `kubectl rollout undo`), then verify pods become
      Ready and the service resumes receiving/serving requests.

  ideal_course_of_action:
    - step: 1
      action: "List namespaces"
      detail: "Enumerate cluster namespaces to identify where the affected application is deployed."

    - step: 2
      action: "List deployments in target namespace"
      detail: "List Deployments/StatefulSets in the application namespace and note which one has 0 replicas."

    - step: 3
      action: "Get deployment details"
      detail: "Retrieve the deployment spec/status to confirm desired vs available replica count is 0/0."

    - step: 4
      action: "Check Kubernetes events"
      detail: "List events in the namespace to check for a recent scale-down (ScalingReplicaSet) event."

    - step: 5
      action: "Check Prometheus alerts/metrics"
      detail: "Query for HighRequestErrorRate / NoRequestsReceived signals correlated with this service."

    - step: 6
      action: "Scale the deployment back up"
      detail: "Restore the deployment's replica count to a healthy value (e.g. 1 or its prior desired count)."

    - step: 7
      action: "Verify pod recovery"
      detail: "Re-list pods to confirm new replicas reach Running/Ready."

    - step: 8
      action: "Validate application health"
      detail: "Confirm the service is receiving/serving traffic again via a health check or Prometheus query."

  ideal_tool_usage_trajectory:
    - step: 1
      tool: "Namespaces: List"
      command: "Namespaces: List"
      purpose: "Locate the namespace hosting the affected application."
      tool_available: true

    - step: 2
      tool: "Resources: List"
      command: "Resources: List apiVersion=apps/v1 kind=Deployment namespace=<target-namespace>"
      purpose: "Find the Deployment with 0 available replicas."
      tool_available: true

    - step: 3
      tool: "Resources: Get"
      command: "Resources: Get apiVersion=apps/v1 kind=Deployment namespace=<target-namespace> name=<deployment-name>"
      purpose: "Confirm desired vs available replica counts are both 0."
      tool_available: true

    - step: 4
      tool: "Events: List"
      command: "Events: List namespace=<target-namespace>"
      purpose: "Check for a ScalingReplicaSet event indicating the scale-down."
      tool_available: true

    - step: 5
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='up{namespace=\"<target-namespace>\"}'"
      purpose: "Confirm no instances of the target service are up."
      tool_available: true

    - step: 6
      tool: "Resources: Scale"
      command: "Resources: Scale apiVersion=apps/v1 kind=Deployment namespace=<target-namespace> name=<deployment-name> scale=<desired-replicas>"
      purpose: "Restore the deployment's replica count."
      tool_available: true

    - step: 7
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=<target-namespace>"
      purpose: "Verify replacement pods reach Running/Ready."
      tool_available: true

    - step: 8
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='up{namespace=\"<target-namespace>\"}'"
      purpose: "Confirm the service is serving traffic again."
      tool_available: true

  sla:
    time_to_detect:
      description: "Max time from fault injection to first correct symptom identification"
      threshold: 60
      unit: "seconds"

    time_to_mitigate:
      description: "Max time from fault injection to successful remediation"
      threshold: 120
      unit: "seconds"

    max_tool_calls:
      description: "Max total tool invocations allowed (including retries)"
      threshold: 14
      unit: "count"
