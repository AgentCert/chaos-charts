---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-delete
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: FORCE
    label: Force
    type: boolean
    group: Injection
  - key: CHAOS_INTERVAL
    label: Chaos interval
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: string
    pattern: '^((100|[1-9]?[0-9])(-(100|[1-9]?[0-9]))?)?$'
    required: false
    group: Injection
    description: >-
      A percentage, or a range such as 50-100 (a random value in it is used;
      lower bound first). Empty uses the runner default.
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    - random
    group: Injection
    description: Choosing random picks serial or parallel at run time.
  displayName: Pod Delete
  categoryDescription: |
    Pod delete fault disrupts the state of Kubernetes resources. This fault injects random pod delete failures against specified application.
    - Causes (forced/graceful) pod failure of random replicas of an application deployment.
    - Tests deployment sanity (replica availability & uninterrupted service) and recovery workflows of the application pod.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Konvoy
    - Packet(Kubeadm)
    - Minikube
    - EKS
    - AKS
    - Kind
    - Rancher
    - OpenShift(OKD)
  maintainers:
    - name: ksatchit
      email: karthik.s@harness.io
  experiments:
    - pod-delete
    - podtato-head
    - sock-shop
    - sock-shop-promProbe
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - url:
      mediatype: ""
