---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: pod-network-loss
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TARGET_CONTAINER
    label: Target container
    type: string
    group: Target
  - key: NETWORK_INTERFACE
    label: Network interface
    type: string
    group: Injection
    advanced: true
  - key: TC_IMAGE
    label: Tc image
    type: string
    group: Injection
    advanced: true
  - key: NETWORK_PACKET_LOSS_PERCENTAGE
    label: Network packet loss percentage
    type: integer
    min: 0
    max: 100
    required: true
    group: Injection
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: PODS_AFFECTED_PERC
    label: Pods affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: TARGET_PODS
    label: Target pods
    type: string
    group: Target
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: CONTAINER_RUNTIME
    label: Container runtime
    type: string
    group: Injection
    advanced: true
  - key: DESTINATION_IPS
    label: Destination ips
    type: string
    group: Injection
  - key: DESTINATION_HOSTS
    label: Destination hosts
    type: string
    group: Injection
  - key: SOCKET_PATH
    label: Socket path
    type: string
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  displayName: Pod Network Loss
  categoryDescription: |
    Pod-network-loss fault disrupts network connectivity to kubernetes pods. This fault injects percentage packet loss on the app replica pods.
    - Causes loss of access to application replica by injecting packet loss using Pumba.
    - The application pod should be healthy once chaos is stopped. Service-requests should be served (say, via alternate replicas) despite chaos.
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - Minikube
    - Packet(Kubeadm)
    - EKS
  maintainers:
    - name: ksatchit
      email: karthik.s@harness.io
  experiments:
    - bank-of-anthos
    - sock-shop
    - sock-shop-promProbe
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - base64data: ""
      mediatype: ""
