---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: node-io-stress
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: LitmusChaos
spec:
  configurations:
  - key: TOTAL_CHAOS_DURATION
    label: Duration (seconds)
    type: integer
    min: 1
    required: true
    group: Timing
    description: Seconds.
  - key: FILESYSTEM_UTILIZATION_PERCENTAGE
    label: Filesystem utilization percentage
    type: integer
    min: 0
    max: 100
    required: true
    group: Injection
  - key: FILESYSTEM_UTILIZATION_BYTES
    label: Filesystem utilization bytes
    type: integer
    min: 0
    required: false
    group: Injection
  - key: CPU
    label: Cpu
    type: integer
    min: 0
    required: true
    group: Injection
  - key: NUMBER_OF_WORKERS
    label: Number of workers
    type: integer
    min: 1
    required: true
    group: Injection
  - key: VM_WORKERS
    label: Vm workers
    type: integer
    min: 1
    required: true
    group: Injection
  - key: TARGET_NODES
    label: Target nodes
    type: string
    group: Target
  - key: NODE_LABEL
    label: Node label
    type: string
    group: Target
  - key: RAMP_TIME
    label: Ramp time (seconds)
    type: integer
    min: 0
    required: false
    group: Timing
    description: Seconds. Empty uses the runner default.
  - key: NODES_AFFECTED_PERC
    label: Nodes affected (%)
    type: integer
    min: 0
    max: 100
    required: false
    group: Injection
  - key: DEFAULT_HEALTH_CHECK
    label: Default health check
    type: boolean
    group: Injection
    advanced: true
  - key: SEQUENCE
    label: Sequence
    type: select
    options:
    - serial
    - parallel
    group: Injection
  displayName: Node IO Stress
  categoryDescription: |
    This fault causes disk stress on the Kubernetes node. This fault aims to verify the resiliency of applications that share this disk resource for ephemeral or persistent storage purposes..
    - Disk stress on a particular node filesystem where the application deployment is available.
    - The amount of disk stress can be either specifed as the size in percentage of the total free space on the file system or simply in Gigabytes(GB)
  keywords:
    - Kubernetes
  platforms:
    - GKE
    - EKS
    - AKS
  maintainers:
    - name: Udit Gaurav
      email: udit.gaurav@harness.io
  chaosType: infra
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: Documentation
      url: https://litmuschaos.github.io/litmus/experiments/categories/contents
  icon:
    - url: ""
      mediatype: ""
