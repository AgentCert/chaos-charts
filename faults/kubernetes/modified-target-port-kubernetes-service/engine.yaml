---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: modified-target-port-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'service'
  chaosServiceAccount: modified-target-port-kubernetes-service-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: modified-target-port-kubernetes-service
      spec:
        components:
          env:
            # broken targetPort value to inject (must not be in use)
            - name: BROKEN_TARGET_PORT
              value: '9999'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
