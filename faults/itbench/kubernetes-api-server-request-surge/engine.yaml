---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: kubernetes-api-server-request-surge-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: ''
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: kubernetes-api-server-request-surge-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: kubernetes-api-server-request-surge
      spec:
        components:
          env:
            # aggregate requests/sec the surge workload targets against the
            # kube-apiserver (matches ITBench scenario 51's fixture)
            - name: REQUESTS_PER_SECOND
              value: '1000'
            # number of load-generator pod replicas
            - name: SURGE_REPLICAS
              value: '5'
            # name of the injected Deployment/ServiceAccount/Role/RoleBinding
            - name: SURGE_WORKLOAD_NAME
              value: 'workload-scanner'
            # Image for the load-generator pods. They run this fault's own
            # binary (/itbench-experiment -api-load), so leaving this empty makes
            # the helpers reuse the experiment's own image and stay on the same
            # build. Only override it with an image containing that binary.
            - name: SURGE_IMAGE
              value: ''
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
