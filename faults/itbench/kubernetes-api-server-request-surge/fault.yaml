---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Deploys a short-lived "load generator" Deployment (default name
    `workload-scanner`, matching ITBench's own fixture and its own
    remediation commands) inside the target namespace. Its pods run a tight,
    parallelized loop of raw Kubernetes API requests (`kubectl get --raw`
    against the namespace's pods endpoint) for ${TOTAL_CHAOS_DURATION}
    seconds at an approximate aggregate rate of ${REQUESTS_PER_SECOND}
    requests/sec, spread across ${SURGE_REPLICAS} replicas. On revert, the
    Deployment and its supporting ServiceAccount/Role/RoleBinding are
    deleted. Mirrors ITBench SRE fault library index 10
    ("kubernetes-api-server-request-surge"), exercised by ITBench scenario
    51 against the `otel-demo` namespace (OpenTelemetry Demo).

    Design note vs. ITBench's own implementation: ITBench's fixture
    (scenarios/sre/project/roles/faults/tasks/
    inject_kubernetes_api_server_request_surge.yaml) provisions a dedicated
    ServiceAccount bound to a *ClusterRole* (get/list/watch across pods,
    services, nodes, namespaces, deployments, replicasets, statefulsets,
    jobs, cronjobs -- i.e. cluster-wide read access) and runs a Python
    (kubernetes-client) load generator, sourced from a ConfigMap, inside a
    `registry.access.redhat.com/ubi10/python-314-minimal` image that `pip
    install`s a `kubernetes` client at container start, calling
    `list_pod_for_all_namespaces` at a fixed request rate for a fixed 1hr
    window. This experiment approximates the same effect -- a sustained,
    tunable-rate burst of requests against the shared kube-apiserver -- using
    only `kubectl` (already present in this chart's `litmuschaos/k8s`
    runner image, so no extra image/registry dependency or pip-install step
    at pod-start time is required) and a *namespace-scoped* Role (get/list
    on pods in ${APP_NAMESPACE} only, not a ClusterRole across all
    resource types cluster-wide). This keeps the injected workload's own
    RBAC footprint minimal, but it is an approximation, not a byte-for-byte
    reproduction of ITBench's fixture:
      - Request duration is tied to ${TOTAL_CHAOS_DURATION} (this chart's
        universal chaos-hold-time convention) rather than ITBench's
        hardcoded 1-hour window.
      - The surge targets one namespace's pods endpoint per request rather
        than `list_pod_for_all_namespaces`; both are equally effective at
        loading the shared apiserver (the whole point of this fault), but
        ITBench's variant additionally exercises cluster-scoped list
        authorization paths.
      - Concurrency/backoff behavior of a shell `kubectl get --raw` loop
        (many short-lived processes, exec'd per-request) differs from a
        single long-lived Python process reusing one HTTP client/connection
        pool; both generate real apiserver load, but the connection-reuse
        characteristics (and therefore exact CPU/latency profile on the
        apiserver) are not identical.

    CAUTION / blast radius: the kube-apiserver is a single, cluster-wide
    control-plane component shared by every namespace and tenant. Even
    though this fault's injected workload and its RBAC are confined to
    ${APP_NAMESPACE}, the *effect* of the resulting request surge
    (elevated apiserver_request_duration_seconds latency, possible
    client-side throttling/timeouts for kubectl/controllers/other
    workloads) is NOT confined to that namespace -- it degrades API
    responsiveness cluster-wide (a HighRequestLatency / KubeAPILatencyHigh-
    style symptom), including for other, unrelated tenants sharing the same
    cluster. Only run this fault against a dedicated/isolated test cluster,
    or with full awareness of this cluster-wide blast radius (the same
    caution this chart applies to cordoned-kubernetes-worker-node).
kind: ChaosExperiment
metadata:
  name: kubernetes-api-server-request-surge
  labels:
    name: kubernetes-api-server-request-surge
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      # Performs CRUD operations on the events inside chaosengine and chaosresult
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      # Create/remove the load-generator's own dedicated (namespace-scoped)
      # ServiceAccount and its Role/RoleBinding
      - apiGroups: [""]
        resources: ["serviceaccounts"]
        verbs: ["create", "get", "list", "delete"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["roles", "rolebindings"]
        verbs: ["create", "get", "list", "delete"]
      # Create/remove the surge Deployment itself
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["create", "get", "list", "delete"]
      # for creation, status polling and deletion of litmus chaos resources used within a chaos workflow
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - kubernetes-api-server-request-surge
    env:
      # used for target resolution by this fault (see design note above),
      # but declared for consistency with this chart's shared env contract.

      # aggregate requests/sec the surge workload targets against the
      # kube-apiserver, split evenly across SURGE_REPLICAS pods; matches
      # ITBench scenario 51's loadGenerator.options.requestsPerSecond fixture
      - name: REQUESTS_PER_SECOND
        value: "1000"

      # number of load-generator pod replicas; matches ITBench's own fixture
      - name: SURGE_REPLICAS
        value: "5"

      # name of the injected Deployment/ServiceAccount/Role/RoleBinding;
      # matches ITBench's own fixture name and its own remediation commands
      # ("kubectl -n <ns> edit|delete deployment workload-scanner")
      - name: SURGE_WORKLOAD_NAME
        value: "workload-scanner"

      # image used for the load-generator pods; defaults to this chart's own
      # kubectl-enabled runner image so no extra registry/pip-install
      # dependency is required at pod-start (see design note above)
      - name: SURGE_IMAGE
        value: "litmuschaos/k8s:latest"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: kubernetes-api-server-request-surge
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
