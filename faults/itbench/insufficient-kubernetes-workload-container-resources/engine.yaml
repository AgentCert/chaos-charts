---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: insufficient-resources-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: insufficient-kubernetes-workload-container-resources-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: insufficient-kubernetes-workload-container-resources
      spec:
        components:
          env:
            # container whose resources are patched; defaults to the workload name
            - name: TARGET_CONTAINER
              value: ''
            # insufficient resource values injected into the container
            - name: FAULT_MEMORY_REQUEST
              value: '8Mi'
            - name: FAULT_MEMORY_LIMIT
              value: '8Mi'
            - name: FAULT_CPU_REQUEST
              value: '1m'
            - name: FAULT_CPU_LIMIT
              value: '1m'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
