---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Patches a container's resources.requests/limits down to unrealistically
    low values (default memory: 8Mi), causing the container to repeatedly
    OOMKill or fail to start (CrashLoopBackOff), then restores the original
    resources block. Mirrors ITBench SRE scenario 46
    (insufficient-kubernetes-workload-container-resources, fault library
    index 8), which targets otel-demo's "postgresql" component. NOTE: this
    assumes the postgresql subchart is enabled in ACE's otel-demo deployment
    (its upstream chart default), which was not independently verified in
    this session.
kind: ChaosExperiment
metadata:
  name: insufficient-kubernetes-workload-container-resources
  labels:
    name: insufficient-kubernetes-workload-container-resources
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - insufficient-kubernetes-workload-container-resources
    env:
      # container name to patch; defaults to the workload name if unset
      - name: TARGET_CONTAINER
        value: ""

      # insufficient resource values matching ITBench's own fixture (unrealistically low memory)
      - name: FAULT_MEMORY_REQUEST
        value: "8Mi"
      - name: FAULT_MEMORY_LIMIT
        value: "8Mi"
      - name: FAULT_CPU_REQUEST
        value: "1m"
      - name: FAULT_CPU_LIMIT
        value: "1m"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: insufficient-kubernetes-workload-container-resources
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
