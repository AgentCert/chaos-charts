---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: valkey-workload-changed-password
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: ITBench
    chartDescription: >-
      Changes the password/credential used to authenticate to a Valkey
      (Redis-compatible) workload, then restores the original credential.
      Mirrors ITBench SRE scenario "valkey-workload-changed-password".
spec:
  displayName: Valkey Workload Changed Password
  categoryDescription: |
    Valkey workload changed password fault disrupts authentication to a
    Valkey (Redis-compatible) Kubernetes workload by overwriting its
    credentials Secret and forcing the container to require the (now
    invalid) password.
    - Simulates a credential-rotation mistake or compromised-credential
      scenario that breaks dependent services' ability to authenticate.
    - Tests whether an agent detects HighRequestLatency / authentication
      errors and restores connectivity by fixing the credential or rolling
      back the workload.
  keywords:
    - Kubernetes
    - ITBench
  platforms:
    - GKE
    - AKS
    - EKS
    - Kind
    - Minikube
  maintainers:
    - name: AgentCert Team
      email: agentcert@microsoft.com
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: ITBench
      url: https://github.com/itbench-hub/ITBench
  icon:
    - url: ""
      mediatype: ""
