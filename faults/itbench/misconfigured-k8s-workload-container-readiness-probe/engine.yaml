---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: misconfigured-readiness-probe-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: misconfigured-k8s-workload-container-readiness-probe-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: misconfigured-k8s-workload-container-readiness-probe
      spec:
        components:
          env:
            # container whose readinessProbe is broken; defaults to the workload name
            - name: TARGET_CONTAINER
              value: ''
            # broken probe port (deliberately unreachable)
            - name: PROBE_PORT
              value: '40'
            # broken probe path
            - name: PROBE_PATH
              value: '/ready'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
