---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Scales a Deployment/StatefulSet identified by label to zero replicas, then
    restores its original replica count. Mirrors ITBench SRE scenario
    "scaled-to-zero-kubernetes-workload" (fault library index 20).

    Implemented as a real litmus-go SDK experiment binary (bin/itbench-experiment,
    -name scaled-to-zero-kubernetes-workload; source:
    experiments/itbench/scaled-to-zero-kubernetes-workload/experiment) rather than a raw
    shell script -- target resolution uses the SDK's own TARGETS env var mechanism
    (types.InitialiseChaosVariables / types.GetTargets, confirmed live: the operator
    does populate TARGETS from ChaosEngine.spec.appinfo), and the experiment reports a
    real ChaosResult (SOT/EOT, verdict, probeSuccessPercentage) via pkg/result -- the
    raw-shell-script approach never wrote one, so the operator/subscriber/UI always
    reported Fail/0% for this fault regardless of whether the injection succeeded.
kind: ChaosExperiment
metadata:
  name: scaled-to-zero-kubernetes-workload
  labels:
    name: scaled-to-zero-kubernetes-workload
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - scaled-to-zero-kubernetes-workload
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: scaled-to-zero-kubernetes-workload
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
