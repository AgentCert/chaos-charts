---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: scaled-to-zero-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  chaosServiceAccount: scaled-to-zero-kubernetes-workload-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: scaled-to-zero-kubernetes-workload
      spec:
        components:
          env:
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
