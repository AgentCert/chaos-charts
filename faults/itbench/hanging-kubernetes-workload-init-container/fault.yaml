---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Appends a hanging init container (one that sleeps forever) to a
    Deployment/StatefulSet identified by label, leaving every pod stuck in
    `Init:0/1`/Pending forever, then removes the appended init container to
    restore normal startup. Mirrors ITBench SRE scenario
    "hanging-kubernetes-workload-init-container" (fault library index 5).
kind: ChaosExperiment
metadata:
  name: hanging-kubernetes-workload-init-container
  labels:
    name: hanging-kubernetes-workload-init-container
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - hanging-kubernetes-workload-init-container
    env:
      # hanging init container parameters, matching ITBench's own fixture
      # (see inject_hanging_kubernetes_workload_init_container.yaml)
      - name: HANG_CONTAINER_NAME
        value: "worker"
      - name: HANG_CONTAINER_IMAGE
        value: "registry.access.redhat.com/ubi10-minimal:10.2-1782798957"
      - name: HANG_COMMAND
        value: "sleep infinity"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: hanging-kubernetes-workload-init-container
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
