---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Overwrites one named environment variable on a container with a bad
    value, then restores the original value (or removes the variable if it
    did not exist originally). Mirrors ITBench SRE scenario 16, which
    reassigns otel-demo's "shipping" container QUOTE_ADDR env var to an
    unreachable address, and fault library index 13
    (modified-kubernetes-workload-container-environment-variable).
kind: ChaosExperiment
metadata:
  name: modified-k8s-workload-container-environment-variable
  labels:
    name: modified-k8s-workload-container-environment-variable
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:latest"
    # Never, because this image is built from the checkout and side-loaded into
    # the cluster; it is not published to Docker Hub, so a missing side-load must
    # fail loudly instead of trying to pull something that does not exist. The
    # server rewrites this to Always when ITBENCH_EXPERIMENT_IMAGE_SOURCE=registry,
    # where the moving :dev tag has to be re-pulled. Override with
    # ITBENCH_EXPERIMENT_IMAGE_PULL_POLICY.
    imagePullPolicy: Never
    command:
      - /itbench-experiment
    args:
      - -name
      - modified-k8s-workload-container-environment-variable
    env:
      # container whose environment variable is modified; defaults to the
      # workload name if unset
      - name: TARGET_CONTAINER
        value: ""

      # environment variable to overwrite, and the bad value to inject —
      # defaults match ITBench scenario 16 (otel-demo "shipping" container's
      # QUOTE_ADDR, which is pointed at an unreachable address so it can no
      # longer reach the "quote" service)
      - name: ENV_VAR_NAME
        value: "QUOTE_ADDR"
      - name: BAD_ENV_VALUE
        value: "quote:0000"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: modified-k8s-workload-container-environment-variable
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
