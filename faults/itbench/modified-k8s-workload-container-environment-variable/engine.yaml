---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: modified-env-var-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: modified-k8s-workload-container-environment-variable-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: modified-k8s-workload-container-environment-variable
      spec:
        components:
          env:
            # container whose environment variable is modified; defaults to
            # the workload name if left empty
            - name: TARGET_CONTAINER
              value: ''
            # environment variable to overwrite
            - name: ENV_VAR_NAME
              value: 'QUOTE_ADDR'
            # bad value to inject (deliberately unreachable)
            - name: BAD_ENV_VALUE
              value: 'quote:0000'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
