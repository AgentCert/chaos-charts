---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Replaces a Service's selector with an invalid label value so the Service
    has no matching Endpoints, causing all inbound traffic to be dropped, then
    restores the original selector. Mirrors ITBench SRE scenario
    "invalid-kubernetes-service-selector" (index 36).
kind: ChaosExperiment
metadata:
  name: invalid-kubernetes-service-selector
  labels:
    name: invalid-kubernetes-service-selector
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events", "services", "endpoints"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - invalid-kubernetes-service-selector
    env:
      # suffix appended to "invalid-workload-" to make the selector value unique
      - name: RANDOM_SUFFIX
        value: "1"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: invalid-kubernetes-service-selector
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
