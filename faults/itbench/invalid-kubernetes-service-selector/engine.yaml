---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: invalid-service-selector-chaos
  namespace: default
spec:
  engineState: 'active'
  # ChaosEngine.spec.appinfo.appkind is CRD-restricted to workload kinds, so this
  # fault addresses its service target through the SDK's own TARGETS variable below.
  # Chaos Studio fills TARGETS in from the target you pick; set it by hand only when
  # applying this engine directly.
  appinfo:
    appns: ''
    applabel: ''
    appkind: ''
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: invalid-kubernetes-service-selector-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: invalid-kubernetes-service-selector
      spec:
        components:
          env:
            # "service:<namespace>:[<label-selector>]"
            - name: TARGETS
              value: ''
            # suffix for the invalid selector value; change to avoid collisions
            - name: RANDOM_SUFFIX
              value: '1'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
