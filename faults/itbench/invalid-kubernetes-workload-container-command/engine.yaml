---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: invalid-workload-command-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: invalid-kubernetes-workload-container-command-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: invalid-kubernetes-workload-container-command
      spec:
        components:
          env:
            # container whose command/args are overwritten; defaults to the
            # workload name
            - name: TARGET_CONTAINER
              value: ''
            # invalid command/args to inject (JSON array strings)
            - name: INVALID_COMMAND
              value: '["/nonexistent-binary"]'
            - name: INVALID_ARGS
              value: '[]'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
