fault: invalid-kubernetes-workload-container-command
version: 0.1.0
description: >-
  Overwrites a container's command with a nonexistent executable (and
  clears its args), causing the container to fail immediately and the pod
  to enter CrashLoopBackOff. Mirrors ITBench SRE scenario 105 (otel-demo's
  `product-catalog` service having a malformed command) and fault library
  index 9 (invalid-kubernetes-workload-container-command).

ground_truth:
  fault_description_goal_remediation:
    symptoms:
      - "Target pod(s) show CrashLoopBackOff status with a rapidly increasing restart count"
      - "Container status is Terminated / Waiting with a reason such as 'StartError' or 'CrashLoopBackOff' and a non-zero exit code"
      - "KubePodCrashLooping alert fires for the affected workload"
      - "kubectl describe pod shows an event like 'Error: failed to create containerd task: ... exec: \"/nonexistent-binary\": stat /nonexistent-binary: no such file or directory'"
      - "The workload's Deployment/StatefulSet shows 0 available/ready replicas while desired replicas remain unchanged"

    goal: >
      Overwrite a container's command with an invalid, nonexistent binary
      to validate whether an agent detects the resulting CrashLoopBackOff,
      identifies the malformed command in the workload spec, and restores
      the workload to a healthy running state.

    remediation: >
      Revert the last change to the workload manifest
      (`kubectl rollout undo deployment/<name>`) or manually edit the
      Deployment/StatefulSet (`kubectl edit deployment <name>`) to remove or
      replace the invalid command, then verify the pod transitions to
      Running/Ready.

  ideal_course_of_action:
    - step: 1
      action: "List namespaces"
      detail: "Enumerate cluster namespaces to identify where the affected application is deployed."

    - step: 2
      action: "List deployments in target namespace"
      detail: "List Deployments/StatefulSets in the application namespace and note which one has 0 available replicas."

    - step: 3
      action: "List pods and identify CrashLoopBackOff"
      detail: "List pods in the namespace and find the pod(s) stuck in CrashLoopBackOff with a high restart count."

    - step: 4
      action: "Check Kubernetes events"
      detail: "List events in the namespace; look for container start/exec failure events referencing the invalid command."

    - step: 5
      action: "Inspect deployment spec"
      detail: "Read the Deployment spec and confirm the container's command/args field was overwritten with a nonexistent binary."

    - step: 6
      action: "Check Prometheus alerts/metrics"
      detail: "Query for KubePodCrashLooping and container restart-count metrics correlated with this workload."

    - step: 7
      action: "Rollback or fix the deployment"
      detail: "Either rollout undo the Deployment or patch the container's command/args back to a valid value."

    - step: 8
      action: "Verify pod recovery"
      detail: "Re-list pods to confirm the workload reaches Running/Ready and the restart count stabilizes."

  ideal_tool_usage_trajectory:
    - step: 1
      tool: "Namespaces: List"
      command: "Namespaces: List"
      purpose: "Locate the namespace hosting the affected application."
      tool_available: true

    - step: 2
      tool: "Resources: List"
      command: "Resources: List apiVersion=apps/v1 kind=Deployment namespace=<target-namespace>"
      purpose: "Find the Deployment with unavailable/unready replicas."
      tool_available: true

    - step: 3
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=<target-namespace>"
      purpose: "Identify the pod(s) stuck in CrashLoopBackOff."
      tool_available: true

    - step: 4
      tool: "Events: List"
      command: "Events: List namespace=<target-namespace>"
      purpose: "Find container start/exec failure events referencing the invalid command."
      tool_available: true

    - step: 5
      tool: "Resources: Get"
      command: "Resources: Get apiVersion=apps/v1 kind=Deployment namespace=<target-namespace> name=<deployment-name>"
      purpose: "Read the Deployment spec and confirm the container's command was overwritten with a nonexistent binary."
      tool_available: true

    - step: 6
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='kube_pod_container_status_restarts_total{namespace=\"<target-namespace>\"}'"
      purpose: "Confirm the escalating restart count via Prometheus."
      tool_available: true

    - step: 7
      tool: "Rollback Deployment"
      command: "Rollback Deployment namespace=<target-namespace> name=<deployment-name>"
      purpose: "Restore the previous revision to remove the invalid command."
      tool_available: true

    - step: 8
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=<target-namespace>"
      purpose: "Verify the pod reaches Running/Ready after rollback."
      tool_available: true

  sla:
    time_to_detect:
      description: "Max time from fault injection to first correct symptom identification"
      threshold: 60
      unit: "seconds"

    time_to_mitigate:
      description: "Max time from fault injection to successful remediation"
      threshold: 120
      unit: "seconds"

    max_tool_calls:
      description: "Max total tool invocations allowed (including retries)"
      threshold: 14
      unit: "count"
