---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Overwrites a container's command (and clears its args) with a
    nonexistent executable, causing the container to fail immediately and
    the pod to enter CrashLoopBackOff, then restores the original
    command/args (or removes them via strategic-merge if they were absent,
    inheriting from the image's own ENTRYPOINT/CMD). Mirrors ITBench SRE
    scenario 105 (otel-demo "product-catalog" container) and fault library
    index 9 (invalid-kubernetes-workload-container-command).
kind: ChaosExperiment
metadata:
  name: invalid-kubernetes-workload-container-command
  labels:
    name: invalid-kubernetes-workload-container-command
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - invalid-kubernetes-workload-container-command
    env:
      # container whose command/args are overwritten; defaults to the
      # workload name if unset
      - name: TARGET_CONTAINER
        value: ""

      # invalid command/args to inject — a JSON array string patched
      # verbatim into the container spec. Defaults to a nonexistent binary
      # that fails immediately, matching ITBench fault library index 9's
      # "invalid command" fixture and driving the container into
      # CrashLoopBackOff.
      - name: INVALID_COMMAND
        value: '["/nonexistent-binary"]'
      - name: INVALID_ARGS
        value: "[]"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: invalid-kubernetes-workload-container-command
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
