---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Patches a Deployment/StatefulSet's pod template with a
    requiredDuringSchedulingIgnoredDuringExecution inter-pod anti-affinity
    rule against its own label (topologyKey=kubernetes.io/hostname), which
    the cluster's node topology cannot satisfy, so replacement pods become
    permanently Pending, then restores the original affinity. Mirrors
    ITBench SRE scenario "unschedulable-kubernetes-workload-pod-anti-affinity-rule"
    (fault library index 25).
kind: ChaosExperiment
metadata:
  name: unschedulable-kubernetes-workload-pod-anti-affinity-rule
  labels:
    name: unschedulable-kubernetes-workload-pod-anti-affinity-rule
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "litmuschaos/k8s:latest"
    imagePullPolicy: Always
    command:
      - /bin/sh
    args:
      - -c
      - |
        set -eu
        # The chaos-operator on this cluster declares APP_NAMESPACE/APP_LABEL/APP_KIND
        # as env var names but never populates their values from
        # ChaosEngine.spec.appinfo -- verified empirically (a real ChaosEngine
        # submission mistargeted an unrelated deployment because both vars were
        # empty). This operator version instead sets a single combined TARGETS var,
        # format "<kind>:<namespace>:[<label-selector>]:<mode>". Derive the vars
        # every fault-injection script here still expects from it, and only fall
        # back to whatever APP_KIND/APP_NAMESPACE/APP_LABEL already say if TARGETS
        # isn't set (e.g. a future/different operator version that does populate
        # them directly).
        if [ -n "${TARGETS:-}" ]; then
          APP_KIND=$(echo "$TARGETS" | cut -d: -f1)
          APP_NAMESPACE=$(echo "$TARGETS" | cut -d: -f2)
          APP_LABEL=$(echo "$TARGETS" | cut -d: -f3 | tr -d '[]')
        fi
        echo "Resolving target ${APP_KIND} in ns=${APP_NAMESPACE} label=${APP_LABEL}"
        TARGET=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" -l "${APP_LABEL}" -o jsonpath='{.items[0].metadata.name}')
        if [ -z "$TARGET" ]; then
          echo "no ${APP_KIND} found matching label ${APP_LABEL} in ${APP_NAMESPACE}" >&2
          exit 1
        fi
        echo "Target=${TARGET}"

        # The anti-affinity rule is matched against the workload's own label
        # (its own pods) unless a different label is explicitly given.
        AFFINITY_LABEL="${ANTI_AFFINITY_LABEL:-$APP_LABEL}"
        AFFINITY_KEY=$(echo "$AFFINITY_LABEL" | cut -d'=' -f1)
        AFFINITY_VALUE=$(echo "$AFFINITY_LABEL" | cut -d'=' -f2)
        echo "Anti-affinity label: ${AFFINITY_KEY}=${AFFINITY_VALUE} topologyKey=${TOPOLOGY_KEY}"

        # Capture original podAntiAffinity block — empty string means none existed
        ORIG_ANTI_AFFINITY=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" \
          -o jsonpath='{.spec.template.spec.affinity.podAntiAffinity}')
        echo "Original podAntiAffinity: ${ORIG_ANTI_AFFINITY:-<none>}"

        BROKEN_ANTI_AFFINITY="{\"requiredDuringSchedulingIgnoredDuringExecution\":[{\"labelSelector\":{\"matchExpressions\":[{\"key\":\"${AFFINITY_KEY}\",\"operator\":\"In\",\"values\":[\"${AFFINITY_VALUE}\"]}]},\"topologyKey\":\"${TOPOLOGY_KEY}\"}]}"
        echo "Injecting: unsatisfiable required pod anti-affinity on ${TARGET}"
        kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=strategic \
          -p "{\"spec\":{\"template\":{\"spec\":{\"affinity\":{\"podAntiAffinity\":${BROKEN_ANTI_AFFINITY}}}}}}"

        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
        sleep "${TOTAL_CHAOS_DURATION}"

        # Revert: null removes the field (strategic-merge-patch semantics); otherwise restore original
        if [ -z "$ORIG_ANTI_AFFINITY" ]; then
          ANTI_AFFINITY_JSON="null"
        else
          ANTI_AFFINITY_JSON="$ORIG_ANTI_AFFINITY"
        fi
        echo "Reverting podAntiAffinity to original"
        kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=strategic \
          -p "{\"spec\":{\"template\":{\"spec\":{\"affinity\":{\"podAntiAffinity\":${ANTI_AFFINITY_JSON}}}}}}"
    env:
      # Injected by the chaos-operator from ChaosEngine.spec.appinfo
      - name: APP_NAMESPACE
        value: ""
      - name: APP_LABEL
        value: ""
      - name: APP_KIND
        value: "deployment"

      # label (key=value) the injected anti-affinity rule must never co-locate
      # with; defaults to the workload's own resolution label (APP_LABEL) so
      # a replacement pod can never share a node with an existing one
      - name: ANTI_AFFINITY_LABEL
        value: ""

      # topology domain the anti-affinity rule is scoped to; the standard
      # per-node key means the rule can only be satisfied by scheduling onto
      # a node that has no existing matching pod
      - name: TOPOLOGY_KEY
        value: "kubernetes.io/hostname"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: unschedulable-kubernetes-workload-pod-anti-affinity-rule
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
