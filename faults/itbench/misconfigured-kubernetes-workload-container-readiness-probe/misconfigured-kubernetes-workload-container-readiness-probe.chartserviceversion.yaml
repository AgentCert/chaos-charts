---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: misconfigured-kubernetes-workload-container-readiness-probe
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: ITBench
    chartDescription: >-
      Patches a container's readinessProbe to probe an unreachable port,
      causing the pod to stay NotReady, then restores the original probe.
      Mirrors ITBench SRE scenario
      "misconfigured-kubernetes-workload-container-readiness-probe".
spec:
  displayName: Broken Readiness Probe
  categoryDescription: |
    Misconfigured readiness probe fault disrupts traffic to a Kubernetes workload
    by patching the target container's readinessProbe to point at an unreachable
    port.
    - Simulates an operator mistake that makes a pod permanently NotReady.
    - Tests whether an agent detects KubePodNotReady and corrects the probe
      or performs a rollout undo.
  keywords:
    - Kubernetes
    - ITBench
  platforms:
    - GKE
    - AKS
    - EKS
    - Kind
    - Minikube
  maintainers:
    - name: AgentCert Team
      email: agentcert@microsoft.com
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: ITBench
      url: https://github.com/itbench-hub/ITBench
  icon:
    - url: ""
      mediatype: ""
