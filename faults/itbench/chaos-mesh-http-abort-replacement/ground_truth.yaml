fault: chaos-mesh-http-abort-replacement
version: 0.1.0
description: >-
  LitmusChaos-native approximation of ITBench SRE scenario 27, which uses
  Chaos Mesh's HTTPChaos "abort" action to drop POST requests to
  OpenTelemetry Demo's `quote` service (otel-demo namespace, port 8080).
  Since LitmusChaos has no L7 HTTP-proxy fault, this creates a NetworkPolicy
  that denies L3/L4 ingress on port 8080 to the `quote` pods (while leaving
  any other ports it exposes reachable), holds it, then deletes it.

ground_truth:
  fault_description_goal_remediation:
    symptoms:
      - "Callers of `quote` (e.g. checkout) see connection refused/timeout or gRPC UNAVAILABLE calling quote:8080"
      - "HighRequestErrorRate / elevated error rate on checkout's calls to quote, and/or NoRequestsReceived on quote itself"
      - "`quote` pods remain Running (this is a network-layer outage, not a pod crash) -- though if quote's own health probes target port 8080, they may also start failing as a side effect of this approximation, unlike the original Chaos Mesh scenario which only intercepts POST requests"
      - "An unfamiliar NetworkPolicy exists in otel-demo, selecting the `quote` pods, with policyTypes=[Ingress] and an ingress rule set that does not include port 8080"
      - "kubectl -n otel-demo get networkpolicy shows a policy named like '<quote-deployment>-http-abort-fault'"

    goal: >
      Approximate Chaos Mesh's HTTPChaos abort=true fault against otel-demo's
      `quote` service (port 8080) using a LitmusChaos-native NetworkPolicy
      that denies ingress on that specific port, to validate whether an
      agent detects the resulting connectivity outage / elevated error rate
      on `quote`, locates the offending port-scoped NetworkPolicy, and
      removes it to restore traffic. Note: this is a coarser approximation
      than the original fault -- it blocks ALL traffic on port 8080
      (any method), not just POST requests, since NetworkPolicy operates at
      L3/L4 and has no HTTP-method/path semantics.

    remediation: >
      Identify the offending NetworkPolicy in otel-demo
      (`kubectl -n otel-demo get networkpolicy`), inspect it to confirm it
      selects the `quote` pods and its ingress rules omit port 8080, then
      delete it (`kubectl -n otel-demo delete networkpolicy <name>`) so
      ingress traffic to `quote` on port 8080 resumes.

  ideal_course_of_action:
    - step: 1
      action: "List namespaces"
      detail: "Enumerate cluster namespaces to identify where the affected application (otel-demo) is deployed."

    - step: 2
      action: "List pods in target namespace"
      detail: "List pods in otel-demo and confirm the `quote` pods are Running/Ready despite reported errors, pointing away from a pod-health issue."

    - step: 3
      action: "Check Kubernetes events"
      detail: "List events in otel-demo for connectivity-related signals; NetworkPolicy creation is not itself eventful, so the absence of crash/restart events narrows the cause toward networking."

    - step: 4
      action: "List NetworkPolicies in the namespace"
      detail: "Run `kubectl -n otel-demo get networkpolicy` to spot an unexpected, recently-created policy selecting the `quote` workload."

    - step: 5
      action: "Inspect the suspicious NetworkPolicy"
      detail: "Get the NetworkPolicy's spec and confirm its podSelector matches `quote`, policyTypes includes Ingress, and its allowed ingress ports omit 8080 (the service's port)."

    - step: 6
      action: "Check Prometheus alerts/metrics"
      detail: "Query for HighRequestErrorRate / elevated error rate on calls to `quote` (e.g. from checkout) to corroborate the connectivity impact."

    - step: 7
      action: "Delete the offending NetworkPolicy"
      detail: "Remove the port-scoped deny NetworkPolicy so ingress traffic to `quote` on port 8080 is restored."

    - step: 8
      action: "Verify traffic recovery"
      detail: "Confirm the NetworkPolicy is gone and `quote` is reachable/serving requests on port 8080 again via a health check or Prometheus query."

  ideal_tool_usage_trajectory:
    - step: 1
      tool: "Namespaces: List"
      command: "Namespaces: List"
      purpose: "Locate the otel-demo namespace hosting the affected `quote` service."
      tool_available: true

    - step: 2
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=otel-demo"
      purpose: "Confirm `quote` pods are Running/Ready despite reported errors, pointing away from a pod-health issue."
      tool_available: true

    - step: 3
      tool: "Events: List"
      command: "Events: List namespace=otel-demo"
      purpose: "Check for recent events; absence of crash/restart events narrows the cause toward networking."
      tool_available: true

    - step: 4
      tool: "Resources: List"
      command: "Resources: List apiVersion=networking.k8s.io/v1 kind=NetworkPolicy namespace=otel-demo"
      purpose: "Enumerate NetworkPolicies in otel-demo to spot an unexpected policy selecting `quote`."
      tool_available: true

    - step: 5
      tool: "Resources: Get"
      command: "Resources: Get apiVersion=networking.k8s.io/v1 kind=NetworkPolicy namespace=otel-demo name=<networkpolicy-name>"
      purpose: "Confirm the policy selects `quote`, sets policyTypes=[Ingress], and its allowed ports omit 8080."
      tool_available: true

    - step: 6
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='rate(traces_span_metrics_calls_total{service_name=\"quote\",status_code=\"STATUS_CODE_ERROR\"}[5m])'"
      purpose: "Confirm HighRequestErrorRate / connectivity-loss signals correlated with the `quote` service."
      tool_available: true

    - step: 7
      tool: "Resources: Delete"
      command: "Resources: Delete apiVersion=networking.k8s.io/v1 kind=NetworkPolicy namespace=otel-demo name=<networkpolicy-name>"
      purpose: "Remove the port-scoped deny NetworkPolicy so ingress traffic to `quote` on port 8080 is restored."
      tool_available: true

    - step: 8
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='up{namespace=\"otel-demo\",service=\"quote\"}'"
      purpose: "Verify `quote` is reachable and serving traffic again after the policy is removed."
      tool_available: true

  sla:
    time_to_detect:
      description: "Max time from fault injection to first correct symptom identification"
      threshold: 60
      unit: "seconds"

    time_to_mitigate:
      description: "Max time from fault injection to successful remediation"
      threshold: 120
      unit: "seconds"

    max_tool_calls:
      description: "Max total tool invocations allowed (including retries)"
      threshold: 14
      unit: "count"
