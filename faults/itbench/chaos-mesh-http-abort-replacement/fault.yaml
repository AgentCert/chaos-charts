---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    LitmusChaos-native approximation of Chaos Mesh's HTTPChaos "abort" action
    (ITBench SRE scenario 27: aborted POST requests to OpenTelemetry Demo's
    `quote` service, port 8080). Chaos Mesh intercepts traffic at L7 inside
    the pod's network namespace and aborts only requests matching a method/
    path; LitmusChaos has no equivalent HTTP-proxy primitive, so this fault
    instead creates a NetworkPolicy that denies L3/L4 ingress on the target
    port only (leaving any other ports the workload exposes reachable), then
    deletes it to restore connectivity. This is a coarser approximation: it
    drops ALL traffic to the port (not just POST requests) -- see the
    ground_truth.yaml goal/remediation for the documented deviation.
kind: ChaosExperiment
metadata:
  name: chaos-mesh-http-abort-replacement
  labels:
    name: chaos-mesh-http-abort-replacement
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["networkpolicies"]
        verbs: ["create", "get", "list", "delete"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - chaos-mesh-http-abort-replacement
    env:
      # port to deny ingress on -- matches ITBench scenario 27's Chaos Mesh
      # HTTPChaos target (otel-demo `quote` service, port 8080)
      - name: TARGET_PORT
        value: "8080"
      - name: TARGET_PROTOCOL
        value: "TCP"

      # name of the NetworkPolicy this fault creates; defaults to
      # "<target>-http-abort-fault" if left blank, so it never collides
      # with a pre-existing, legitimately-owned NetworkPolicy
      - name: NETPOL_NAME
        value: ""

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: chaos-mesh-http-abort-replacement
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
