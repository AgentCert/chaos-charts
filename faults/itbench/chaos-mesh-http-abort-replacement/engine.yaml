---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: chaos-mesh-http-abort-replacement-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: ''
  chaosServiceAccount: chaos-mesh-http-abort-replacement-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: chaos-mesh-http-abort-replacement
      spec:
        components:
          env:
            # port to deny ingress on; matches ITBench scenario 27's Chaos
            # Mesh HTTPChaos target (otel-demo `quote` service, port 8080)
            - name: TARGET_PORT
              value: '8080'
            - name: TARGET_PROTOCOL
              value: 'TCP'
            # name of the NetworkPolicy created by the fault; defaults to
            # "<target>-http-abort-fault" if left blank
            - name: NETPOL_NAME
              value: ''
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
