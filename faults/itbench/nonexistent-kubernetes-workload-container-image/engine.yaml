---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: nonexistent-image-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: nonexistent-kubernetes-workload-container-image-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: nonexistent-kubernetes-workload-container-image
      spec:
        components:
          env:
            - name: TARGET_CONTAINER
              value: ''

            - name: INVALID_IMAGE
              value: 'quay.io/it-bench/hello-bench-invalid:1.0.0'

            - name: TOTAL_CHAOS_DURATION
              value: '300'
