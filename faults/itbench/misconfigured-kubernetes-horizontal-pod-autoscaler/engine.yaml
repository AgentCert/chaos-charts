---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: misconfigured-hpa-chaos
  namespace: default
spec:
  engineState: 'active'
  # ChaosEngine.spec.appinfo.appkind is CRD-restricted to workload kinds, so this
  # fault addresses its horizontalpodautoscaler target through the SDK's own TARGETS variable below.
  # Chaos Studio fills TARGETS in from the target you pick; set it by hand only when
  # applying this engine directly.
  appinfo:
    appns: ''
    applabel: ''
    appkind: ''
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: misconfigured-kubernetes-horizontal-pod-autoscaler-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: misconfigured-kubernetes-horizontal-pod-autoscaler
      spec:
        components:
          env:
            # "horizontalpodautoscaler:<namespace>:[<label-selector>]"
            - name: TARGETS
              value: ''
            # misconfigured CPU utilization target (deliberately too low)
            - name: CPU_UTILIZATION_PERCENT
              value: '20'
            # misconfigured memory utilization target (deliberately too low)
            - name: MEMORY_UTILIZATION_PERCENT
              value: '30'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
