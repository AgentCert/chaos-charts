---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: crashing-init-container-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: crashing-kubernetes-workload-init-container-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: crashing-kubernetes-workload-init-container
      spec:
        components:
          env:
            # distinctive name for the injected initContainer so revert can find it
            - name: INIT_CONTAINER_NAME
              value: 'chaos-crashing-init'
            # small image used to run the bad script
            - name: INIT_CONTAINER_IMAGE
              value: 'busybox:1.36'
            # the "bad script" that always fails, forcing Init:CrashLoopBackOff
            - name: BAD_SCRIPT
              value: "echo 'chaos: executing malformed startup script'; exit 1"
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
