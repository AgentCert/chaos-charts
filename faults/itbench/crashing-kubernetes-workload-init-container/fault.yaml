---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Injects an additional initContainer that runs a deliberately bad script
    into a Deployment/StatefulSet's pod template, so the pod becomes stuck in
    Init:CrashLoopBackOff and the main container never starts, then reverts
    by removing only the injected initContainer. Mirrors ITBench SRE
    scenario "crashing-kubernetes-workload-init-container" (fault library
    index 2).
kind: ChaosExperiment
metadata:
  name: crashing-kubernetes-workload-init-container
  labels:
    name: crashing-kubernetes-workload-init-container
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:latest"
    # Never, because this image is built from the checkout and side-loaded into
    # the cluster; it is not published to Docker Hub, so a missing side-load must
    # fail loudly instead of trying to pull something that does not exist. The
    # server rewrites this to Always when ITBENCH_EXPERIMENT_IMAGE_SOURCE=registry,
    # where the moving :dev tag has to be re-pulled. Override with
    # ITBENCH_EXPERIMENT_IMAGE_PULL_POLICY.
    imagePullPolicy: Never
    command:
      - /itbench-experiment
    args:
      - -name
      - crashing-kubernetes-workload-init-container
    env:
      # distinctive name for the injected initContainer so revert can find it
      - name: INIT_CONTAINER_NAME
        value: "chaos-crashing-init"

      # small image used to run the bad script
      - name: INIT_CONTAINER_IMAGE
        value: "busybox:1.36"

      # the "bad script" that always fails, forcing Init:CrashLoopBackOff
      - name: BAD_SCRIPT
        value: "echo 'chaos: executing malformed startup script'; exit 1"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: crashing-kubernetes-workload-init-container
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
