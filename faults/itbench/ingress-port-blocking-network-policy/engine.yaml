---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: ingress-port-blocking-network-policy-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: ingress-port-blocking-network-policy-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: ingress-port-blocking-network-policy
      spec:
        components:
          env:
            # name of the deny-all NetworkPolicy created by the fault;
            # defaults to "<target>-ingress-block-fault" if left blank
            - name: NETPOL_NAME
              value: ''
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
