---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: ingress-port-blocking-network-policy
  version: 0.1.0
  annotations:
    categories: Kubernetes
    vendor: ITBench
    chartDescription: >-
      Creates a NetworkPolicy that denies all ingress traffic to a workload's
      pods, then deletes it. Mirrors ITBench SRE fault library index 6
      "ingress-port-blocking-network-policy".
spec:
  displayName: Blocked Ingress Traffic
  categoryDescription: |
    Ingress port blocking fault disrupts traffic to a Kubernetes workload by
    creating a NetworkPolicy that denies all ingress on the workload's pods.
    - Simulates a misapplied/overly-restrictive NetworkPolicy that cuts off
      an otherwise healthy workload from its callers.
    - Tests whether an agent detects HighRequestErrorRate/NoRequestsReceived,
      locates the offending NetworkPolicy, and removes or corrects it.
  keywords:
    - Kubernetes
    - ITBench
  platforms:
    - GKE
    - AKS
    - EKS
    - Kind
    - Minikube
  maintainers:
    - name: AgentCert Team
      email: agentcert@microsoft.com
  minKubeVersion: 1.12.0
  labels:
    app.kubernetes.io/component: chartserviceversion
    app.kubernetes.io/version: ci
  links:
    - name: ITBench
      url: https://github.com/itbench-hub/ITBench
  icon:
    - url: ""
      mediatype: ""
