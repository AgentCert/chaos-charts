---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Patches a Deployment/StatefulSet's pod template with a
    requiredDuringSchedulingIgnoredDuringExecution inter-pod anti-affinity
    rule against its own label (topologyKey=kubernetes.io/hostname), which
    the cluster's node topology cannot satisfy, so replacement pods become
    permanently Pending, then restores the original affinity. Mirrors
    ITBench SRE scenario "unschedulable-kubernetes-workload-pod-anti-affinity-rule"
    (fault library index 25).
kind: ChaosExperiment
metadata:
  name: unschedulable-k8s-workload-pod-anti-affinity-rule
  labels:
    name: unschedulable-k8s-workload-pod-anti-affinity-rule
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:latest"
    # Never, because this image is built from the checkout and side-loaded into
    # the cluster; it is not published to Docker Hub, so a missing side-load must
    # fail loudly instead of trying to pull something that does not exist. The
    # server rewrites this to Always when ITBENCH_EXPERIMENT_IMAGE_SOURCE=registry,
    # where the moving :dev tag has to be re-pulled. Override with
    # ITBENCH_EXPERIMENT_IMAGE_PULL_POLICY.
    imagePullPolicy: Never
    command:
      - /itbench-experiment
    args:
      - -name
      - unschedulable-k8s-workload-pod-anti-affinity-rule
    env:
      # label (key=value) the injected anti-affinity rule must never co-locate
      # with; defaults to the workload's own resolution label (APP_LABEL) so
      # a replacement pod can never share a node with an existing one
      - name: ANTI_AFFINITY_LABEL
        value: ""

      # topology domain the anti-affinity rule is scoped to; the standard
      # per-node key means the rule can only be satisfied by scheduling onto
      # a node that has no existing matching pod
      - name: TOPOLOGY_KEY
        value: "kubernetes.io/hostname"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: unschedulable-k8s-workload-pod-anti-affinity-rule
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
