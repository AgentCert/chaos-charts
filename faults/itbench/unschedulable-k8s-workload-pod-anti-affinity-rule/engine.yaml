---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: unschedulable-pod-anti-affinity-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'deployment'
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: unschedulable-k8s-workload-pod-anti-affinity-rule-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: unschedulable-k8s-workload-pod-anti-affinity-rule
      spec:
        components:
          env:
            # label (key=value) the anti-affinity rule targets; defaults to
            # the workload's own applabel above (its own pods)
            - name: ANTI_AFFINITY_LABEL
              value: ''
            # topology domain the anti-affinity rule is scoped to
            - name: TOPOLOGY_KEY
              value: 'kubernetes.io/hostname'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
