---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Creates or patches a namespace-scoped ResourceQuota with hard cpu/memory
    limits far too low for the target workload to (re)schedule, then restores
    the quota's original spec (or deletes it entirely if it did not exist
    before injection). A rollout restart of the target Deployment/StatefulSet
    is used to force new pod admission attempts against the tightened quota.
    Mirrors ITBench SRE scenario "insufficient-kubernetes-resource-quota"
    (fault library index 7), as used in ITBench scenarios 52 (otel-demo
    "checkout") and 102 (otel-demo "ad").
kind: ChaosExperiment
metadata:
  name: insufficient-kubernetes-resource-quota
  labels:
    name: insufficient-kubernetes-resource-quota
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: [""]
        resources: ["resourcequotas"]
        verbs: ["get", "list", "create", "patch", "update", "delete"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - insufficient-kubernetes-resource-quota
    env:
      # name of the ResourceQuota object to create/patch; matches ITBench's
      # own fixture ("kubectl -n otel-demo edit/delete resourcequota memory")
      - name: QUOTA_NAME
        value: "memory"

      # underprovisioned hard limits — deliberately far below any real
      # container's typical requests/limits so new pod admission always fails
      - name: QUOTA_HARD_REQUESTS_CPU
        value: "10m"
      - name: QUOTA_HARD_REQUESTS_MEMORY
        value: "16Mi"
      - name: QUOTA_HARD_LIMITS_CPU
        value: "20m"
      - name: QUOTA_HARD_LIMITS_MEMORY
        value: "32Mi"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: insufficient-kubernetes-resource-quota
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
