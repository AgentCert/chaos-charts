---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: chaos-mesh-pod-failure-replacement-chaos
  namespace: default
spec:
  engineState: 'active'
  # ChaosEngine.spec.appinfo.appkind is CRD-restricted to workload kinds, so this
  # fault addresses its pod target through the SDK's own TARGETS variable below.
  # Chaos Studio fills TARGETS in from the target you pick; set it by hand only when
  # applying this engine directly.
  appinfo:
    appns: ''
    applabel: ''
    appkind: ''
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: chaos-mesh-pod-failure-replacement-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: chaos-mesh-pod-failure-replacement
      spec:
        components:
          env:
            # "pod:<namespace>:[<label-selector>]"
            - name: TARGETS
              value: ''
            # container (within the matched pod) whose main process gets frozen
            - name: TARGET_CONTAINER
              value: 'checkout'

            # image for the ephemeral debug container used to reach a
            # distroless target's PID namespace; must include a shell and a
            # `kill` binary supporting -STOP/-CONT
            - name: DEBUG_IMAGE
              value: 'busybox:1.36'

            # seconds to hold the fault (freeze) before it self-reverts
            - name: TOTAL_CHAOS_DURATION
              value: '300'
