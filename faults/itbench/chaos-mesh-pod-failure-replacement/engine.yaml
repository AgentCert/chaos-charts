---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: chaos-mesh-pod-failure-replacement-chaos
  namespace: default
spec:
  engineState: 'active'
  appinfo:
    appns: ''
    applabel: ''
    appkind: 'pod'
  chaosServiceAccount: chaos-mesh-pod-failure-replacement-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: chaos-mesh-pod-failure-replacement
      spec:
        components:
          env:
            # container (within the matched pod) whose main process gets frozen
            - name: TARGET_CONTAINER
              value: 'checkout'

            # image for the ephemeral debug container used to reach a
            # distroless target's PID namespace; must include a shell and a
            # `kill` binary supporting -STOP/-CONT
            - name: DEBUG_IMAGE
              value: 'busybox:1.36'

            # seconds to hold the fault (freeze) before it self-reverts
            - name: TOTAL_CHAOS_DURATION
              value: '300'
