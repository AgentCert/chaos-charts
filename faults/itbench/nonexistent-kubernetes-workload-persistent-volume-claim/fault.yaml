---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Creates a PersistentVolumeClaim referencing an invalid StorageClass, patches
    the target workload to mount it, causing pods to stuck in Pending/Init due to
    a FailedMount event, then reverts via rollout undo and deletes the PVC.
    Mirrors ITBench SRE scenario
    "nonexistent-kubernetes-workload-persistent-volume-claim" (index 53).
kind: ChaosExperiment
metadata:
  name: nonexistent-kubernetes-workload-persistent-volume-claim
  labels:
    name: nonexistent-kubernetes-workload-persistent-volume-claim
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events", "persistentvolumeclaims"]
        verbs: ["create", "get", "list", "patch", "update", "delete"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "deployments/rollback"]
        verbs: ["get", "list", "patch", "update", "create"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "agentcert/itbench-experiment:dev"
    imagePullPolicy: IfNotPresent
    command:
      - /itbench-experiment
    args:
      - -name
      - nonexistent-kubernetes-workload-persistent-volume-claim
    env:
      # container name to add the volumeMount to; defaults to the workload name if unset
      - name: TARGET_CONTAINER
        value: ""

      # StorageClass name that does not exist in the cluster
      - name: INVALID_STORAGE_CLASS
        value: "invalid-class-name"

      # mount path for the fault volume inside the container
      - name: PVC_MOUNT_PATH
        value: "/data/fault"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: nonexistent-kubernetes-workload-persistent-volume-claim
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
