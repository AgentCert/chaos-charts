fault: nonexistent-kubernetes-workload-node
version: 0.1.0
description: >-
  Adds a nodeSelector referencing a node name that does not exist in the
  cluster to a Deployment/StatefulSet's pod template, leaving the pod(s)
  permanently unschedulable (stuck Pending). Mirrors ITBench SRE fault
  library index 16 (nonexistent-kubernetes-workload-node), as exercised by
  ITBench scenario 33 against the OpenTelemetry Demo's `ad` and `cart`
  Deployments in namespace otel-demo.

ground_truth:
  fault_description_goal_remediation:
    symptoms:
      - "Target pod(s) remain in `Pending` state indefinitely and are never scheduled"
      - "`kubectl describe pod` shows a FailedScheduling event: '0/N nodes are available: N node(s) didn't match Pod's node affinity/selector'"
      - "Deployment status shows desired replicas greater than available/ready replicas"
      - "KubePodNotReady alert fires for the affected workload"
      - "Callers of the affected service receive connection errors / timeouts since no pod backs the Service endpoint"

    goal: >
      Patch a workload's pod template with a nodeSelector that references a
      node name absent from the cluster to validate whether an agent detects
      the resulting scheduling failure (Pending pod, no available nodes) and
      removes or corrects the nodeSelector to restore scheduling.

    remediation: >
      Remove or correct the invalid nodeSelector on the Deployment/StatefulSet
      (e.g. via `kubectl rollout undo` to revert to the previous ReplicaSet
      spec, or `kubectl edit`/`kubectl patch` to drop the offending
      nodeSelector key), then verify the pod is scheduled and reaches
      Running/Ready.

  ideal_course_of_action:
    - step: 1
      action: "List namespaces"
      detail: "Enumerate cluster namespaces to identify where the affected application (otel-demo) is deployed."

    - step: 2
      action: "List deployments in target namespace"
      detail: "List Deployments in otel-demo and note which one (e.g. ad or cart) shows desired replicas but 0 available/ready."

    - step: 3
      action: "List pods in namespace"
      detail: "List pods in otel-demo and identify the pod(s) stuck in `Pending` phase."

    - step: 4
      action: "Get pod details"
      detail: "Retrieve pod status/conditions to confirm the pod is unscheduled and has not been assigned a node."

    - step: 5
      action: "Check Kubernetes events"
      detail: "List events in the namespace; look for a FailedScheduling event citing a node affinity/selector mismatch."

    - step: 6
      action: "Inspect deployment spec"
      detail: "Read the Deployment's pod template spec and find the nodeSelector referencing a node name that doesn't exist in the cluster."

    - step: 7
      action: "Check Prometheus alerts"
      detail: "Query for KubePodNotReady correlated with this service to corroborate the scheduling failure."

    - step: 8
      action: "Remove or correct the nodeSelector"
      detail: "Roll back the Deployment (`kubectl rollout undo`) or patch out the invalid nodeSelector key so the pod can be scheduled again."

    - step: 9
      action: "Verify pod recovery"
      detail: "Re-list pods to confirm the pod transitions from Pending to Running/Ready on a real node."

  ideal_tool_usage_trajectory:
    - step: 1
      tool: "Namespaces: List"
      command: "Namespaces: List"
      purpose: "Locate the namespace hosting the affected application (otel-demo)."
      tool_available: true

    - step: 2
      tool: "Resources: List"
      command: "Resources: List apiVersion=apps/v1 kind=Deployment namespace=<target-namespace>"
      purpose: "Find the Deployment with desired replicas greater than available replicas."
      tool_available: true

    - step: 3
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=<target-namespace>"
      purpose: "Identify the pod(s) stuck in Pending phase."
      tool_available: true

    - step: 4
      tool: "Events: List"
      command: "Events: List namespace=<target-namespace>"
      purpose: "Find the FailedScheduling event describing the node affinity/selector mismatch."
      tool_available: true

    - step: 5
      tool: "Resources: Get"
      command: "Resources: Get apiVersion=apps/v1 kind=Deployment namespace=<target-namespace> name=<deployment-name>"
      purpose: "Read the pod template spec and confirm the nodeSelector references a nonexistent node."
      tool_available: true

    - step: 6
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='kube_pod_status_phase{namespace=\"<target-namespace>\",phase=\"Pending\"}'"
      purpose: "Confirm the pod remains in Pending phase via Prometheus."
      tool_available: true

    - step: 7
      tool: "Rollback Deployment"
      command: "Rollback Deployment namespace=<target-namespace> name=<deployment-name>"
      purpose: "Revert the Deployment to the previous revision, removing the invalid nodeSelector."
      tool_available: true

    - step: 8
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=<target-namespace>"
      purpose: "Verify the pod is scheduled and reaches Running/Ready."
      tool_available: true

  sla:
    time_to_detect:
      description: "Max time from fault injection to first correct symptom identification"
      threshold: 60
      unit: "seconds"

    time_to_mitigate:
      description: "Max time from fault injection to successful remediation"
      threshold: 120
      unit: "seconds"

    max_tool_calls:
      description: "Max total tool invocations allowed (including retries)"
      threshold: 14
      unit: "count"
