---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: opentelemetry-demo-feature-flag-chaos
  namespace: default
spec:
  engineState: 'active'
  # ChaosEngine.spec.appinfo.appkind is CRD-restricted to workload kinds, so this
  # fault addresses its configmap target through the SDK's own TARGETS variable below.
  # Chaos Studio fills TARGETS in from the target you pick; set it by hand only when
  # applying this engine directly.
  appinfo:
    appns: ''
    applabel: ''
    appkind: ''
  # Stopping a run must leave the target restored, so the experiment pod needs
  # longer than Kubernetes' 30s default: it still has to revert (RevertTimeout,
  # 90s) and then verify the target actually recovered (STATUS_CHECK_TIMEOUT,
  # 180s by default) before it may be killed.
  terminationGracePeriodSeconds: 300
  chaosServiceAccount: opentelemetry-demo-feature-flag-sa
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: opentelemetry-demo-feature-flag
      spec:
        components:
          env:
            # "configmap:<namespace>:[<label-selector>]"
            - name: TARGETS
              value: ''
            # name of the feature flag to toggle (see flagd-config's
            # demo.flagd.json ".flags" map for valid names)
            - name: FLAG_NAME
              value: 'loadGeneratorFloodHomepage'
            # value written to the flag's defaultVariant during injection
            - name: FLAG_STATE
              value: 'on'
            # fallback revert value if the original defaultVariant can't be captured
            - name: FLAG_REVERT_STATE
              value: 'off'
            # seconds to hold the fault before reverting
            - name: TOTAL_CHAOS_DURATION
              value: '300'
