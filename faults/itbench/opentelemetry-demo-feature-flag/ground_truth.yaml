fault: opentelemetry-demo-feature-flag
version: 0.1.0
description: >-
  Patches the OpenTelemetry Demo's flagd-config ConfigMap, setting a named
  feature flag's defaultVariant to a given value (e.g. "on"), then restores
  its original value. Mirrors ITBench SRE scenarios 1, 3, and 52
  (opentelemetry-demo-feature-flag, fault library index 18).

ground_truth:
  fault_description_goal_remediation:
    symptoms:
      - "The service governed by the toggled flag exhibits the flag's documented anomaly (e.g. loadGeneratorFloodHomepage floods the frontend with traffic; adHighCpu drives the ad service's CPU usage up)"
      - "HighRequestErrorRate, high latency, and/or high CPU/memory alerts fire for the affected service and its callers"
      - "The flagd-config ConfigMap's demo.flagd.json shows the named flag's 'defaultVariant' set to the injected value instead of its normal 'off'"
      - "flagd pod logs show the flag configuration was reloaded with a non-default variant in effect"

    goal: >
      Toggle a named OpenTelemetry Demo feature flag (e.g.
      loadGeneratorFloodHomepage, adHighCpu, cartFailure, paymentFailure, ...)
      via the flagd-config ConfigMap to validate whether an agent detects the
      resulting behavioral anomaly, correlates it back to the responsible
      feature flag, and restores normal service behavior.

    remediation: >
      Edit the flagd-config ConfigMap (`kubectl -n otel-demo edit configmap
      flagd-config`) to set the offending flag's defaultVariant back to its
      normal/off value, then restart the Deployment workloads
      (`kubectl -n otel-demo rollout restart deployment`) so flagd and the
      affected service pick up the corrected configuration.

  ideal_course_of_action:
    - step: 1
      action: "List namespaces"
      detail: "Enumerate cluster namespaces to identify where the affected application (otel-demo) is deployed."

    - step: 2
      action: "List pods/deployments in target namespace"
      detail: "Identify which service is exhibiting anomalous behavior (traffic flood, high CPU, elevated error rate, etc.)."

    - step: 3
      action: "Check Kubernetes events"
      detail: "List events in the namespace looking for anything correlated with the onset of the anomaly."

    - step: 4
      action: "Check Prometheus alerts/metrics"
      detail: "Query for request-rate, latency, CPU, or error-rate signals that match the anomaly's signature and timing."

    - step: 5
      action: "Inspect the flagd-config ConfigMap"
      detail: "Read the demo.flagd.json data key and find the feature flag whose 'defaultVariant' is unexpectedly set to 'on'."

    - step: 6
      action: "Patch the ConfigMap to disable the flag"
      detail: "Restore the identified flag's 'defaultVariant' to its normal/off value in the flagd-config ConfigMap."

    - step: 7
      action: "Restart the affected Deployments"
      detail: "Roll out restart the flagd Deployment (and the workload governed by the flag) so the corrected configuration takes effect."

    - step: 8
      action: "Verify recovery"
      detail: "Re-check Prometheus metrics/pod health to confirm the anomaly has subsided and the service has returned to normal behavior."

  ideal_tool_usage_trajectory:
    - step: 1
      tool: "Namespaces: List"
      command: "Namespaces: List"
      purpose: "Locate the namespace hosting the affected application."
      tool_available: true

    - step: 2
      tool: "Pods: List in Namespace"
      command: "Pods: List in Namespace namespace=<target-namespace>"
      purpose: "Identify which service is showing anomalous behavior."
      tool_available: true

    - step: 3
      tool: "Events: List"
      command: "Events: List namespace=<target-namespace>"
      purpose: "Look for events correlated with the onset of the anomaly."
      tool_available: true

    - step: 4
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='rate(http_server_request_duration_seconds_count{namespace=\"<target-namespace>\"}[5m])'"
      purpose: "Confirm the anomaly's signature (traffic/CPU/latency spike) and timing."
      tool_available: true

    - step: 5
      tool: "Resources: Get"
      command: "Resources: Get apiVersion=v1 kind=ConfigMap namespace=<target-namespace> name=flagd-config"
      purpose: "Read demo.flagd.json and find the feature flag whose defaultVariant is unexpectedly 'on'."
      tool_available: true

    - step: 6
      tool: "Resources: Patch"
      command: "Resources: Patch apiVersion=v1 kind=ConfigMap namespace=<target-namespace> name=flagd-config"
      purpose: "Restore the identified flag's defaultVariant to its normal/off value."
      tool_available: true

    - step: 7
      tool: "Deployment: Rollout Restart"
      command: "Deployment: Rollout Restart namespace=<target-namespace> name=flagd"
      purpose: "Restart flagd (and the affected workload) so the corrected flag configuration takes effect."
      tool_available: true

    - step: 8
      tool: "Execute PromQL Query"
      command: "Execute PromQL Query query='rate(http_server_request_duration_seconds_count{namespace=\"<target-namespace>\"}[5m])'"
      purpose: "Confirm the anomaly has subsided and the service has returned to normal behavior."
      tool_available: true

  sla:
    time_to_detect:
      description: "Max time from fault injection to first correct symptom identification"
      threshold: 60
      unit: "seconds"

    time_to_mitigate:
      description: "Max time from fault injection to successful remediation"
      threshold: 180
      unit: "seconds"

    max_tool_calls:
      description: "Max total tool invocations allowed (including retries)"
      threshold: 16
      unit: "count"
